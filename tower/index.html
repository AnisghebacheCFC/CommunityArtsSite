<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Tower · Painterly Ink Edition · Community Arts</title>
<style>
:root{--bg:#f3ede4;--ink:#2a2420;--mut:#6f655c;--card:#fffaf2;--line:#d8cdbf;--acc:#b5482a;--accink:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1714;--ink:#f1e8dd;--mut:#a89b8d;--card:#26201b;--line:#3a322b;--acc:#e0714d;--accink:#1b1714;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1714;--ink:#f1e8dd;--mut:#a89b8d;--card:#26201b;--line:#3a322b;--acc:#e0714d;--accink:#1b1714;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 Georgia,"Times New Roman",serif}
#app{display:flex;flex-direction:column;height:100%}
#cv{flex:1;min-height:0;position:relative;overflow:hidden;touch-action:pan-y;cursor:grab;background:var(--bg)}
#cv canvas{display:block;position:relative;z-index:2;pointer-events:none}
h1{position:absolute;left:16px;top:12px;margin:0;font-size:22px;letter-spacing:.01em;pointer-events:none}
h1 small{display:block;font-size:13px;font-weight:400;color:var(--mut);font-style:italic}
#count{position:absolute;left:16px;bottom:10px;z-index:4;font:12px system-ui,sans-serif;color:var(--mut);pointer-events:none}
.hint{color:var(--mut);font-size:12px;line-height:1.5;margin:9px 0 0}
aside{background:var(--card);border-top:1px solid var(--line);padding:14px 16px;overflow:auto;max-height:48%;font-family:system-ui,sans-serif;font-size:14px}
@media(min-width:760px){#app{flex-direction:row}aside{width:340px;max-height:none;border-top:0;border-left:1px solid var(--line)}}
aside h2{font:600 13px system-ui,sans-serif;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:16px 0 8px}
aside h2:first-child{margin-top:0}
.actions{display:grid;gap:10px;margin-bottom:12px}
.actions button{width:100%;text-align:left;padding:14px 16px;font-size:15px;display:flex;align-items:center;justify-content:space-between}
.actions button[aria-expanded="true"]{background:var(--ink);color:var(--card)}
.panel{padding:4px 0 16px;border-bottom:1px solid var(--line)}
.panel[hidden]{display:none}
.panel h2{margin:4px 0 12px}
.result-list{display:grid;gap:6px;margin-top:10px;max-height:240px;overflow:auto}
.result-list button{text-align:left;background:var(--bg);color:var(--ink);border:1px solid var(--line);font-weight:500;padding:9px 10px}
.result-list button small{display:block;color:var(--mut);font-weight:400;margin-top:3px}
#art-panel{margin:16px 0;border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--bg)}
#art-panel h2{margin:0 0 8px}
#art-panel .art-toggle{display:flex;align-items:center;gap:8px;margin:6px 0 12px}
#art-panel input[type=range]{width:100%;accent-color:var(--acc)}
#art-panel .art-readout{float:right;color:var(--mut);font-size:12px}
#admin-area{margin-top:18px}
#admin-area summary{cursor:pointer;color:var(--mut);font-size:12px}
#admin-area h2{margin:14px 0 7px}
label{display:block;margin:8px 0 3px;color:var(--mut);font-size:13px}
input[type=text],select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
textarea{resize:vertical;min-height:54px}
.row{display:flex;gap:8px}.row input{flex:1}
.chk{display:flex;gap:8px;align-items:center;margin:10px 0;color:var(--ink)}
button{padding:9px 14px;border:0;border-radius:6px;background:var(--acc);color:var(--accink);font:600 14px system-ui,sans-serif;cursor:pointer}
button.ghost{background:transparent;color:var(--acc);border:1px solid var(--line);font-weight:500}
#msg,#info{margin-top:10px;padding:10px 12px;border-radius:6px;background:var(--bg);border:1px solid var(--line)}
#msg:empty,#info:empty{display:none}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:9px;background:var(--acc);color:var(--accink);margin-left:6px;vertical-align:middle}
.id{font-family:ui-monospace,Menlo,monospace}
#cv.pick{cursor:pointer}
#note{position:absolute;left:0;top:0;width:min(280px,31%);padding:14px 16px 12px;background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:0 12px 30px rgba(0,0,0,.2);font:italic 17px/1.38 Georgia,"Times New Roman",serif;pointer-events:none;opacity:0;transition:opacity .45s ease}
#note.on{opacity:1}
#note .msg{display:block}
#note .by{display:block;margin-top:9px;font:13px system-ui,sans-serif;font-style:normal;color:var(--mut)}
#note .by b{color:var(--ink)}
#note .nid{display:block;margin-top:4px;font:11px ui-monospace,Menlo,monospace;font-style:normal;color:var(--mut);opacity:.8}

/* Featured artwork */
#featured-artwork{position:absolute;top:34px;left:42px;width:clamp(220px,25vw,360px);z-index:1;font-family:system-ui,sans-serif;pointer-events:auto;transform:translateZ(0)}
#featured-artwork .featured-frame{display:block;position:relative;aspect-ratio:4/5;overflow:hidden;background:rgba(255,250,242,.82);border:1px solid rgba(216,205,191,.95);border-radius:4px;text-decoration:none;color:var(--ink);cursor:default;box-shadow:0 22px 42px rgba(0,0,0,.18),0 6px 14px rgba(0,0,0,.10);backdrop-filter:blur(2px);transform:rotate(-1.25deg)}
#featured-artwork .featured-frame.is-linked{cursor:pointer}
#featured-artwork img{width:100%;height:100%;object-fit:contain;display:none}
#featured-artwork.has-image img{display:block}
#featured-artwork .featured-placeholder{position:absolute;inset:0;display:grid;place-items:center;padding:18px;color:var(--mut);text-align:center;font:italic 15px/1.5 Georgia,serif}
#featured-artwork.has-image .featured-placeholder{display:none}
#featured-artwork .featured-title{margin:10px 0 0 8px;font:italic 16px/1.3 Georgia,serif;overflow-wrap:anywhere;text-shadow:0 1px 0 rgba(255,255,255,.35)}
#featured-artwork .featured-credit{margin:4px 0 0 8px;color:var(--mut);font-size:12px;overflow-wrap:anywhere;text-shadow:0 1px 0 rgba(255,255,255,.35)}
#featured-artwork [hidden]{display:none}
#note{z-index:5}
@media(max-width:759px){#featured-artwork{top:24px;left:20px;width:clamp(160px,38vw,240px)}#featured-artwork .featured-frame{aspect-ratio:4/5}}
@media(max-height:480px){#featured-artwork{top:18px;left:18px;width:160px}}
</style>
</head>
<body>
<div id="app">
  <div id="cv">
    <section id="featured-artwork" aria-label="Featured community artwork">
      <a class="featured-frame" id="featured-artwork-link" aria-label="Featured artwork" tabindex="-1">
        <img id="featured-artwork-image" alt="">
        <span class="featured-placeholder">Featured artwork</span>
      </a>
      <p class="featured-title" id="featured-artwork-title" hidden></p>

    <div id="count"></div><div id="note"></div></div>
  <aside>
    <div class="actions" aria-label="Tower actions">
      <button id="toggle-add" type="button" aria-expanded="false" aria-controls="add-panel">Add Your Brick <span aria-hidden="true">+</span></button>

    </div>
    <section id="add-panel" class="panel" hidden>
      
      <label for="nm">Name</label><input id="nm" type="text" maxlength="40" autocomplete="name">
      <label for="af">Affiliation (optional)</label>
      <input id="af" type="text" maxlength="80" placeholder="Organisation, university or group">
      
      <label for="ms">Short message (optional)</label><textarea id="ms" maxlength="140"></textarea>
      <div class="chk"><input id="an" type="checkbox"><label for="an" style="margin:0;color:inherit">Keep me anonymous</label></div>

    </section>
    <section id="find-panel" class="panel" hidden>
      
      <label for="search-mode">Search by</label>
      <select id="search-mode"><option value="code">Brick code</option><option value="name">Contributor name</option></select>
      <label for="q" id="search-label">Brick code</label>
      <div class="row"><input id="q" type="text" placeholder="e.g. CA-7K2QX" aria-label="Brick code"><button id="go" type="button" class="ghost">Find</button></div>
      <div id="results" class="result-list" aria-live="polite"></div>

      <input id="ink-strength" type="range" min="0" max="100" value="100">
      <label for="streak-strength">Dragged strokes <span class="art-readout" id="streak-value">100%</span></label>
      <input id="streak-strength" type="range" min="0" max="100" value="100">

      <div class="row"><button id="more500" type="button" class="ghost">+500 bricks</button><button id="more2000" type="button" class="ghost">+2,000 bricks</button></div>
    </details>
  </aside>
</div>

<script>

// FEATURED ARTWORK INTEGRATION (for Cursor / Journal admin):
// After password-protected admin authentication, the Journal admin should save
// ONE public featured-artwork record to its database. The tower READS the public
// record; it must never expose the admin password, service-role key or write API.
// Set window.TOWER_FEATURED_ARTWORK_ENDPOINT to a public read-only JSON endpoint
// in a script loaded BEFORE this one, e.g. /functions/v1/featured-artwork.
// Expected JSON: {"image_url":"https://...","title":"...","artist":"...","journal_url":"https://..."}.
// For immediate client-side previews, call window.setTowerFeaturedArtwork(record).
// A real cross-device change requires the shared endpoint (not localStorage).
(function setupFeaturedArtwork(){
  const panel=document.getElementById('featured-artwork');
  const img=document.getElementById('featured-artwork-image');
  const link=document.getElementById('featured-artwork-link');
  const title=document.getElementById('featured-artwork-title');
  const credit=document.getElementById('featured-artwork-credit');
  function safeUrl(value){
    if(typeof value!=='string'||!value.trim())return '';
    try{const url=new URL(value,location.href);return ['https:','http:'].includes(url.protocol)?url.href:''}catch{return ''}
  }
  window.setTowerFeaturedArtwork=function(record){
    const data=record?.featured_artwork||record?.data||record||{};
    const imageUrl=safeUrl(data.image_url||data.imageUrl||data.image);
    const journalUrl=safeUrl(data.journal_url||data.journalUrl||data.url);
    img.onload=()=>{panel.classList.add('has-image')};
    img.onerror=()=>{panel.classList.remove('has-image');img.removeAttribute('src')};
    panel.classList.remove('has-image');
    if(imageUrl){img.alt=String(data.alt||data.title||'Featured community artwork');img.src=imageUrl}
    else{img.removeAttribute('src');img.alt=''}
    title.textContent=String(data.title||'');
    credit.textContent=String(data.artist||data.credit||'');
    title.hidden=!title.textContent;
    credit.hidden=!credit.textContent;
    if(journalUrl&&imageUrl){link.href=journalUrl;link.target='_blank';link.rel='noopener noreferrer';link.classList.add('is-linked');link.removeAttribute('tabindex')}
    else{link.removeAttribute('href');link.removeAttribute('target');link.classList.remove('is-linked');link.setAttribute('tabindex','-1')}
  };
  async function refreshFeaturedArtwork(){
    const endpoint=safeUrl(window.TOWER_FEATURED_ARTWORK_ENDPOINT);
    if(!endpoint)return;
    try{const response=await fetch(endpoint,{cache:'no-store',headers:{apikey:window.TOWER_SUPABASE_ANON_KEY||'',Authorization:'Bearer '+(window.TOWER_SUPABASE_ANON_KEY||'')}});if(!response.ok)throw new Error('Featured artwork unavailable');window.setTowerFeaturedArtwork(await response.json())}
    catch(error){console.warn('Featured artwork could not be loaded:',error)}
  }
  window.refreshTowerFeaturedArtwork=refreshFeaturedArtwork;
  refreshFeaturedArtwork();
  const featureHitArea=document.getElementById('featured-artwork');
  ['pointerdown','pointerup','click'].forEach(type=>featureHitArea.addEventListener(type,e=>e.stopPropagation()));
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshFeaturedArtwork()});
})();

// Community Arts Tower · instanced rendering prototype (Three.js r128)
const N=30,R=4.8,BH=.42,BD=.62,BW=2*Math.PI*R/N*.96,TAU=Math.PI*2;
const $=id=>document.getElementById(id);
const cv=$("cv"),bricks=[],byId=new Map();
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(42,1,.1,2500);
const ren=new THREE.WebGLRenderer({antialias:true,alpha:true});
cv.appendChild(ren.domElement);
scene.add(new THREE.AmbientLight(0xffffff,.5));
// The sun sits top-right, BEHIND the tower: light travels towards the camera, so shadows fall forward and to the left.
const SUN=new THREE.Vector3(.5,.45,-.74).normalize(); // direction towards the sun
const sun=new THREE.DirectionalLight(0xfff0d6,1.25);scene.add(sun,sun.target);
const fill=new THREE.DirectionalLight(0xffe2c4,.3);fill.position.set(-4,3,12);scene.add(fill);
ren.shadowMap.enabled=true;ren.shadowMap.type=THREE.VSMShadowMap;
sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.radius=7;sun.shadow.blurSamples=16;sun.shadow.bias=-.0004;
function fitSun(){const H=Math.max(1,Math.ceil(bricks.length/N)*BH),e=R+2+H*.55,s=sun.shadow.camera;
  s.left=-e;s.right=e;s.top=e;s.bottom=-e;s.near=1;s.far=H+220;s.updateProjectionMatrix();
  sun.target.position.set(0,H/2,0);sun.position.copy(SUN).multiplyScalar(100).add(sun.target.position);grassU.uTowerH.value=H}
// Transparent ground that shows only the tower's soft cast shadow.
const ground=new THREE.Mesh(new THREE.PlaneGeometry(900,900),new THREE.ShadowMaterial({color:0x2e2142,opacity:.34,depthWrite:false}));
ground.rotation.x=-Math.PI/2;ground.position.y=-.002;ground.receiveShadow=true;scene.add(ground);
const tower=new THREE.Group();scene.add(tower);
// Transparent scene background lets the featured artwork sit visually inside the same space, beneath the tower.
scene.background=null;
ren.setClearColor(0x000000,0);

// One shared, bevelled geometry. The original UV coordinates are preserved.
const C=.045,shp=new THREE.Shape();
{const w=(BW-2*C)/2,h=(BH-2*C)/2;shp.moveTo(-w,-h);shp.lineTo(w,-h);shp.lineTo(w,h);shp.lineTo(-w,h);shp.closePath()}
const geo=new THREE.ExtrudeGeometry(shp,{depth:BD-2*C,bevelEnabled:true,bevelThickness:C,bevelSize:C,bevelSegments:1,steps:1});
geo.center();
{const p=geo.attributes.position,n=geo.attributes.normal,uv=geo.attributes.uv;
 for(let i=0;i<p.count;i++){const x=p.getX(i),y=p.getY(i),z=p.getZ(i),ax=Math.abs(n.getX(i)),ay=Math.abs(n.getY(i)),az=Math.abs(n.getZ(i));
  let u,v;if(az>=ax&&az>=ay){u=x/BW;v=y/BH}else if(ay>=ax){u=x/BW;v=z/BD}else{u=z/BD;v=y/BH}
  uv.setXY(i,u+.5,v+.5)}
 uv.needsUpdate=true}
const texCache={};
function tex(kind){
  if(texCache[kind])return texCache[kind];
  const c=document.createElement("canvas");c.width=64;c.height=32;const g=c.getContext("2d");
  if(kind==="check"){for(let y=0;y<4;y++)for(let x=0;x<8;x++){g.fillStyle=(x+y)%2?"#fff":"#111";g.fillRect(x*8,y*8,8,8)}}
  else{g.fillStyle="#fff";g.fillRect(0,0,64,32);g.strokeStyle="#2f8f4e";g.lineWidth=7;for(let i=-32;i<96;i+=16){g.beginPath();g.moveTo(i,32);g.lineTo(i+32,0);g.stroke()}}
  const t=new THREE.CanvasTexture(c);t.magFilter=THREE.NearestFilter;return texCache[kind]=t;
}
function hash(s){let h=2166136261;for(const ch of s){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function brickColour(id){const h=hash(id);return new THREE.Color().setHSL((h%46)/360,.5+((h>>6)%20)/100,.36+((h>>12)%16)/100)}
function place(i){const layer=Math.floor(i/N),a=(i%N)/N*TAU+(layer%2)*(Math.PI/N);return{layer,a,x:R*Math.cos(a),y:layer*BH+BH/2,z:R*Math.sin(a),ry:-a-Math.PI/2}}
const dummy=new THREE.Object3D();
function matrixFor(p){dummy.position.set(p.x,p.y,p.z);dummy.rotation.set(0,p.ry,0);dummy.scale.set(1,1,1);dummy.updateMatrix();return dummy.matrix}

// Deterministic, procedural stamp atlas: 16 variations, generated once on the CPU.
// The ink sits on oversized planes, letting the marks extend past each brick.
// Procedural directional paint: generated in the shader, not from bitmap stamps.
// The overlay plane extends past the true face so the paint can visibly overhang.
const inkMaterial=new THREE.ShaderMaterial({
  transparent:true,depthWrite:false,side:THREE.FrontSide,
  uniforms:{uInk:{value:1},uSun:{value:SUN},uDrag:{value:1}},
  vertexShader:`
    attribute float aSeed;
    attribute vec3 aInkColor;
    varying vec2 vUv;
    varying vec3 vInkColor;
    varying float vSeed;
    varying float vFacing;
    attribute float aSide;
    varying float vSide;
    varying vec3 vTL;
    varying float vRim;
    varying float vCS;
    uniform vec3 uSun;
    void main(){
      vUv=uv;
      vInkColor=aInkColor;
      vSeed=aSeed;
      vSide=aSide;
      vec3 wn=normalize(mat3(modelMatrix)*mat3(instanceMatrix)*vec3(0.,0.,aSide));
      vFacing=dot(wn,uSun);
      vTL=(instanceMatrix*vec4(position,1.0)).xyz;   // position in the tower's own (rotating) space
      vRim=1.0-abs(dot(wn,normalize(cameraPosition-(modelMatrix*instanceMatrix*vec4(position,1.0)).xyz)));
      vCS=dot(normalize(cameraPosition-(modelMatrix*instanceMatrix*vec4(position,1.0)).xyz),uSun);   // <0: camera is on the far side from the sun
      gl_Position=projectionMatrix*modelViewMatrix*instanceMatrix*vec4(position,1.0);
    }`,
  fragmentShader:`
    uniform float uInk;
    varying vec2 vUv;
    varying vec3 vInkColor;
    varying float vSeed;
    varying float vFacing;
    varying float vSide;
    varying vec3 vTL;
    varying float vRim;
    varying float vCS;
    uniform float uDrag;

    float hash21(vec2 p){
      p=fract(p*vec2(123.34,345.45));
      p+=dot(p,p+34.345);
      return fract(p.x*p.y);
    }
    float noise(vec2 p){
      vec2 i=floor(p),f=fract(p);
      float a=hash21(i),b=hash21(i+vec2(1.,0.)),c=hash21(i+vec2(0.,1.)),d=hash21(i+vec2(1.,1.));
      vec2 u=f*f*(3.-2.*f);
      return mix(mix(a,b,u.x),mix(c,d,u.x),u.y);
    }
    float fbm(vec2 p){
      float v=0.;
      float a=.5;
      for(int i=0;i<4;i++){
        v+=a*noise(p);
        p*=2.02;
        a*=.5;
      }
      return v;
    }

    vec3 hsv(float h,float s,float v){vec3 c=clamp(abs(mod(h*6.0+vec3(0.0,4.0,2.0),6.0)-3.0)-1.0,0.0,1.0);return v*mix(vec3(1.0),c,s);}
    vec3 strokePal(float r,float r2){
      float h=r<0.62?0.01+r2*0.11:(r<0.84?0.93+r2*0.06:0.49+r2*0.04);   // mostly reds and oranges, some pink, a little teal
      return hsv(fract(h),r<0.84?0.62+0.3*r2:0.45,0.80);
    }
    // Dragged strokes live in the tower's own space (angle round the tower, height), so they run across brick joints
    // and turn with the tower. All hashing uses wrapped indices, so there is no seam where the angle wraps.
    vec4 dragged(vec3 tl,float lit){
      float an=atan(tl.z,tl.x)/6.2831853+0.5;
      float y=tl.y;
      // Each patch of the tower is brushed one way: mostly round the tower, some vertical drags.
      float vert=step(0.68,hash21(vec2(floor(y/1.1)*1.31+7.0,mod(floor(an*6.0),6.0)*2.7)));
      float cov=0.0;vec3 col=vec3(0.0);
      if(vert<0.5){
        float bh=0.13,bi=floor(y/bh);
        float nseg=floor(7.0+hash21(vec2(bi,1.3))*9.0);
        float sa=an*nseg+hash21(vec2(bi,5.7));
        float k=floor(sa),t=sa-k,kw=mod(k,nseg);
        float rb=hash21(vec2(floor(y/0.027)*1.9+kw*2.3,bi+7.0));
        float prof=1.0-smoothstep(0.72,1.0,abs(fract(y/bh)-0.5)*2.0+(rb-0.5)*0.5);
        cov=step(0.22,hash21(vec2(bi*1.7+kw*9.3,3.3)))*prof*smoothstep(0.0,0.03,t)*step(t*0.9,rb);
        col=strokePal(hash21(vec2(bi*0.7+kw*1.9,9.1)),hash21(vec2(bi*1.1+kw*0.3,2.9)));
      }else{
        float nb=64.0,ab=an*nb,bj=mod(floor(ab),nb);
        float ell=0.7+1.3*hash21(vec2(bj,2.2));
        float sy=hash21(vec2(bj,4.4))*ell-y;

  const who=b.anon||!b.name?"Anonymous":b.name;
  noteEl.innerHTML=(b.msg?'<span class="msg">“'+esc(b.msg)+'”</span>':'')+'<span class="by">— <b>'+esc(who)+'</b>'+(b.aff&&b.aff!=="None"?" · "+esc(b.aff):"")+'</span><span class="nid">'+esc(b.id)+'</span>';
  noteEl.classList.add("on");posNote();
}
function hideNote(){noteEl.classList.remove("on")}
function posNote(){
  if(!sel)return;const v=sel.curP.clone().project(cam),w=cv.clientWidth,h=cv.clientHeight;
  const pxu=h/2/(Math.tan(THREE.MathUtils.degToRad(cam.fov/2))*cam.position.distanceTo(sel.curP));
  const hw=(noteEl.offsetWidth||280)/2+8,x=Math.min(Math.max((v.x*.5+.5)*w,hw),w-hw),y=(-v.y*.5+.5)*h+BH*sel.curS*.5*pxu+22;
  noteEl.style.transform="translate("+x.toFixed(1)+"px,"+y.toFixed(1)+"px) translateX(-50%) rotate(-1.2deg)";
}
function makeDebris(b,pos,quat,scale){
  const n=20,mesh=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshLambertMaterial({color:0xffffff}),n),pieces=[],c=new THREE.Color();
  const k=b.group.kind,base=k==="plain"?brickColour(b.id):new THREE.Color(k==="check"?0x222222:0x2f8f4e),alt=k==="plain"?base:new THREE.Color(1,1,1);
  mesh.instanceColor=new THREE.InstancedBufferAttribute(new Float32Array(n*3),3);
  for(let i=0;i<n;i++){
    c.copy(i%3===0?alt:base).multiplyScalar(.75+Math.random()*.5);mesh.setColorAt(i,c);
    const lp=new THREE.Vector3((Math.random()-.5)*BW,(Math.random()-.5)*BH,(Math.random()-.5)*BD).multiplyScalar(scale).applyQuaternion(quat);
    pieces.push({p:pos.clone().add(lp),v:new THREE.Vector3((Math.random()-.5)*2.4,1.2+Math.random()*2.4,(Math.random()-.2)*2.2).add(lp.clone().multiplyScalar(.8)),
      r:new THREE.Euler(Math.random()*6,Math.random()*6,Math.random()*6),w:new THREE.Vector3(Math.random()*8-4,Math.random()*8-4,Math.random()*8-4),s:(.10+Math.random()*.24)*scale*.55});
  }
  mesh.frustumCulled=false;scene.add(mesh);return{mesh,pieces};
}
function updateDebris(d,dt,u){
  const fade=1-Math.max(0,(u-.55)/.45);
  d.pieces.forEach((q,i)=>{
    q.v.y-=9*dt;q.p.addScaledVector(q.v,dt);
    if(q.p.y<.05){q.p.y=.05;q.v.y*=-.25;q.v.x*=.7;q.v.z*=.7;q.w.multiplyScalar(.8)}
    q.r.x+=q.w.x*dt;q.r.y+=q.w.y*dt;q.r.z+=q.w.z*dt;
    dummy.position.copy(q.p);dummy.rotation.copy(q.r);dummy.scale.setScalar(q.s*fade+1e-4);dummy.updateMatrix();d.mesh.setMatrixAt(i,dummy.matrix);
  });
  d.mesh.instanceMatrix.needsUpdate=true;
}
function disposeDebris(d){scene.remove(d.mesh);d.mesh.geometry.dispose();d.mesh.material.dispose();d.mesh.dispose()}
function startCrumble(t){
  const s=sel;if(!s||s.phase==="crumble"||s.phase==="return")return;
  hideNote();s.deb=makeDebris(s.b,s.curP,s.curQ,s.curS);disposeTraveler(s.tv);s.tv=null;s.phase="crumble";s.t0=t;
}
function handleClick(e){
  const t=performance.now();
  if(!sel){const h=pickAt(e.clientX,e.clientY);if(h)startSel(h.b,t);return}
  if(sel.phase==="crumble"||sel.phase==="return")return;
  setRay(e.clientX,e.clientY);
  if(sel.tv&&_ray.intersectObject(sel.tv.m,false).length)return;   // the floating brick itself: nothing happens
  startCrumble(t);                                                  // anywhere else: crumble
}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&sel)startCrumble(performance.now())});
function stepSel(t,dt){
  const s=sel,el=(t-s.t0)/1000;
  if(s.phase==="out"){           // shoved out from the inside: a quick punch, a little shudder, then it settles
    const u=Math.min(el/.75,1),d=1.35*eo3(u),w=.16*Math.sin(u*Math.PI*3)*(1-u);
    _p.copy(s.p0).addScaledVector(s.dir,d);_q.copy(s.q0).multiply(_q2.setFromEuler(_e.set(w*.6,w,w*.8)));
    placeTraveler(_p,_q,1);
    if(u>=1){s.phase="fly";s.t0=t;s.fromP.copy(_p);s.fromQ.copy(_q)}
  }else if(s.phase==="fly"){     // up and across to the empty left of the screen, growing as it comes forward
    const u=Math.min(el/1.5,1),e=eio(u),tp=floatPos();
    _p.copy(s.fromP).lerp(tp,e);_p.y+=Math.sin(Math.PI*u)*.45;
    _q.copy(s.fromQ).slerp(floatQuat(0,_q2),e);
    placeTraveler(_p,_q,1+(floatScale-1)*e);
    if(u>=1){s.phase="float";s.t0=t;showNote(s.b)}
  }else if(s.phase==="float"){
    _p.copy(floatPos());_p.y+=.10*floatScale*Math.sin(el*1.3);_p.x+=.04*floatScale*Math.sin(el*.8);
    placeTraveler(_p,floatQuat(el,_q),floatScale);posNote();
  }else if(s.phase==="crumble"){
    const u=Math.min(el/1.1,1);updateDebris(s.deb,dt,u);
    if(u>=1){disposeDebris(s.deb);s.deb=null;s.phase="return";s.t0=t}
  }else if(s.phase==="return"){   // the brick drops back into its place in the tower
    const u=Math.min(el/.5,1);showInstance(s.b,eob(u));
    if(u>=1){showInstance(s.b,1);sel=null}
  }
}
function updateInteraction(t){
  const dt=Math.min(.05,Math.max(0,(t-lastT)/1000));lastT=t;
  hoverMat.uniforms.uPulse.value=.25+.75*(.5+.5*Math.sin(t/1000*2.4));   // slow blink
  if(sel){if(hovered||hoverMesh.visible)setHover(null);stepSel(t,dt);return}
  if(ptr.on&&Math.abs(rot-lastHoverRot)>.0015){lastHoverRot=rot;hoverDirty=true}
  if(hoverDirty&&t-lastPick>60){hoverDirty=false;lastPick=t;setHover(ptr.on&&!drag?pickAt(ptr.x,ptr.y):null)}
}
function esc(s){return String(s??"").replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function show(b){openPanel("find");const who=b.anon||!b.name?"Anonymous":esc(b.name);
  $("info").innerHTML="<strong>"+who+"</strong>"+(b.status==="pending"?'<span class="tag">awaiting approval</span>':"")+
    (b.aff&&b.aff!=="None"?"<br>"+esc(b.aff):"")+(b.msg?"<br><em>“"+esc(b.msg)+"”</em>":"")+
    '<br><span class="id">'+esc(b.id)+"</span> · layer "+(b.p.layer+1);
}
$("add").onclick=()=>{const anon=$("an").checked,name=$("nm").value.trim();if(!anon&&!name){$("msg").textContent="Please add a name, or tick anonymous.";return}
  const b={id:newId(),name:anon?"":name,anon,aff:$("af").value,msg:$("ms").value.trim(),status:"pending",mine:true};
  addBrick(b);saveMine();focus(b);$("info").replaceChildren();
  $("msg").innerHTML="Your brick is in the tower. Your ID is <strong class='id'>"+b.id+"</strong> – keep it to find your brick again. It glows while it waits to be reviewed, then joins the public tower.";
  $("nm").value="";$("af").value="";$("ms").value="";
};
function openPanel(which){
  for(const key of ["add","find"]){const active=key===which,button=$("toggle-"+key);$(key+"-panel").hidden=!active;button.setAttribute("aria-expanded",String(active));}
}
for(const key of ["add","find"]){$("toggle-"+key).onclick=()=>{const isOpen=$("toggle-"+key).getAttribute("aria-expanded")==="true";openPanel(isOpen?null:key)}}
$("search-mode").onchange=()=>{const byName=$("search-mode").value==="name";$("search-label").textContent=byName?"Contributor name":"Brick code";$("q").placeholder=byName?"Enter a contributor's name":"e.g. CA-7K2QX";$("q").setAttribute("aria-label",byName?"Contributor name":"Brick code");$("q").value="";$("results").replaceChildren();$("info").replaceChildren()};
$("go").onclick=()=>{
  const query=$("q").value.trim();$("results").replaceChildren();$("info").replaceChildren();
  if(!query){$("info").textContent="Enter a brick code or contributor name.";return}
  if($("search-mode").value==="code"){
    const b=byId.get(query.toUpperCase());if(!b){$("info").textContent="No brick found with that code.";return}focus(b);show(b);return;
  }
  // Anonymous submissions cannot be discovered through public name search.
  const matches=bricks.filter(b=>!b.anon&&b.name&&b.name.toLocaleLowerCase().includes(query.toLocaleLowerCase())).slice(0,50);
  if(!matches.length){$("info").textContent="No named bricks found.";return}
  for(const b of matches){const button=document.createElement("button");button.type="button";button.textContent=b.name;const extra=document.createElement("small");extra.textContent=b.id+" · Layer "+(b.p.layer+1);button.appendChild(extra);button.onclick=()=>{focus(b);show(b)};$("results").appendChild(button)}
  if(matches.length===50){const note=document.createElement("p");note.className="hint";note.textContent="Showing the first 50 matches. Try a more specific name.";$("results").appendChild(note)}
};
$("q").addEventListener("keydown",e=>{if(e.key==="Enter")$("go").click()});
$("appr").onclick=()=>{for(const b of bricks)if(b.mine&&b.status==="pending")approveBrick(b);saveMine();updateCount();openPanel("add");$("msg").textContent="Approved (demo). In the real version this is the admin’s decision."};
function addTestBricks(n){
  const start=bricks.length;
  for(let i=0;i<n;i++){const j=start+i;addBrick({id:newId(),name:"Test visitor "+(j+1),anon:false,aff:j%23===0?"UAL":j%31===0?"Walworth Garden":"None",msg:"Rendering test brick",status:"approved",visualKind:j%23===0?"check":j%31===0?"stripe":"plain"},false)}
  updateCount();const last=bricks[bricks.length-1];camTarget=Math.max(2.2,last.p.y+.6);
  openPanel("add");$("msg").textContent=n.toLocaleString()+" temporary demo bricks added.";
}
$("more500").onclick=()=>addTestBricks(500);
$("more2000").onclick=()=>addTestBricks(2000);
$("paint-strength").oninput=e=>{const v=Number(e.target.value);postMaterial.uniforms.uStrength.value=v/100;$("strength-value").textContent=v+"%"};
$("streak-strength").oninput=e=>{const v=Number(e.target.value);postMaterial.uniforms.uStreak.value=v/100;inkMaterial.uniforms.uDrag.value=v/100;grassU.uDrag.value=v/100;$("streak-value").textContent=v+"%"};
$("ink-strength").oninput=e=>{const v=Number(e.target.value);inkMaterial.uniforms.uInk.value=v/100;$("ink-value").textContent=v+"%"};
</script>
</body>
