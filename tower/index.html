<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Tower · Painterly Ink Edition · Community Arts</title>
<style>
:root{--bg:#f3ede4;--ink:#2a2420;--mut:#6f655c;--card:#fffaf2;--line:#d8cdbf;--acc:#b5482a;--accink:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1714;--ink:#f1e8dd;--mut:#a89b8d;--card:#26201b;--line:#3a322b;--acc:#e0714d;--accink:#1b1714;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1714;--ink:#f1e8dd;--mut:#a89b8d;--card:#26201b;--line:#3a322b;--acc:#e0714d;--accink:#1b1714;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 Georgia,"Times New Roman",serif}
#app{position:relative;height:100%;overflow:hidden}
#cv{height:100%;position:relative;overflow:hidden;touch-action:pan-y;cursor:grab;background:linear-gradient(180deg,#74bfff 0%,#a9dbff 34%,#d7efff 62%,#f3ede4 100%)}
#cv canvas{display:block;position:relative;z-index:2;pointer-events:none}
h1{position:absolute;left:16px;top:12px;margin:0;font-size:22px;letter-spacing:.01em;pointer-events:none}
h1 small{display:block;font-size:13px;font-weight:400;color:var(--mut);font-style:italic}
#count{position:absolute;left:16px;bottom:10px;z-index:4;font:12px system-ui,sans-serif;color:var(--mut);pointer-events:none}
.hint{color:var(--mut);font-size:12px;line-height:1.5;margin:9px 0 0}
aside{position:absolute;top:18px;right:18px;z-index:4;width:min(320px,calc(100vw - 36px));max-height:calc(100% - 36px);padding:14px 16px 16px;overflow:auto;font-family:system-ui,sans-serif;font-size:14px;background:rgba(255,250,242,.82);border:1px solid rgba(216,205,191,.95);border-radius:12px;box-shadow:0 18px 40px rgba(0,0,0,.16),0 4px 12px rgba(0,0,0,.08);backdrop-filter:blur(8px)}
@media(max-width:759px){#cv{touch-action:none}aside{top:auto;bottom:14px;right:14px;width:min(340px,calc(100vw - 28px));max-height:min(58vh,460px);padding:13px 14px 15px}}
aside h2{font:600 13px system-ui,sans-serif;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:16px 0 8px}
aside h2:first-child{margin-top:0}
.actions{display:grid;gap:10px;margin-bottom:12px}
.actions button{width:100%;text-align:left;padding:14px 16px;font-size:15px;display:flex;align-items:center;justify-content:space-between}
.actions button[aria-expanded="true"]{background:var(--ink);color:var(--card)}
.panel{padding:4px 0 16px;border-bottom:1px solid var(--line)}
.panel[hidden]{display:none}
.panel h2{margin:4px 0 12px}
.result-list{display:grid;gap:6px;margin-top:10px;max-height:240px;overflow:auto}
.result-list button{text-align:left;background:var(--bg);color:var(--ink);border:1px solid var(--line);font-weight:500;padding:9px 10px}
.result-list button small{display:block;color:var(--mut);font-weight:400;margin-top:3px}
#art-panel{margin:16px 0;border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--bg)}
#art-panel h2{margin:0 0 8px}
#art-panel .art-toggle{display:flex;align-items:center;gap:8px;margin:6px 0 12px}
#art-panel input[type=range]{width:100%;accent-color:var(--acc)}
#art-panel .art-readout{float:right;color:var(--mut);font-size:12px}
#admin-area{margin-top:18px}
#admin-area summary{cursor:pointer;color:var(--mut);font-size:12px}
#admin-area h2{margin:14px 0 7px}
label{display:block;margin:8px 0 3px;color:var(--mut);font-size:13px}
input[type=text],select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
textarea{resize:vertical;min-height:54px}
.row{display:flex;gap:8px}.row input{flex:1}
.chk{display:flex;gap:8px;align-items:center;margin:10px 0;color:var(--ink)}
button{padding:9px 14px;border:0;border-radius:6px;background:var(--acc);color:var(--accink);font:600 14px system-ui,sans-serif;cursor:pointer}
button.ghost{background:transparent;color:var(--acc);border:1px solid var(--line);font-weight:500}
#msg,#info{margin-top:10px;padding:10px 12px;border-radius:6px;background:var(--bg);border:1px solid var(--line)}
#msg:empty,#info:empty{display:none}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:9px;background:var(--acc);color:var(--accink);margin-left:6px;vertical-align:middle}
.id{font-family:ui-monospace,Menlo,monospace}
#cv.pick{cursor:pointer}
#note{position:absolute;left:0;top:0;width:min(280px,31%);padding:14px 16px 12px;background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:0 12px 30px rgba(0,0,0,.2);font:italic 17px/1.38 Georgia,"Times New Roman",serif;pointer-events:none;opacity:0;transition:opacity .45s ease}
#note.on{opacity:1}
#note .msg{display:block}
#note .by{display:block;margin-top:9px;font:13px system-ui,sans-serif;font-style:normal;color:var(--mut)}
#note .by b{color:var(--ink)}
#note .nid{display:block;margin-top:4px;font:11px ui-monospace,Menlo,monospace;font-style:normal;color:var(--mut);opacity:.8}

/* Featured artwork */
#featured-artwork{position:absolute;top:34px;left:42px;width:clamp(220px,25vw,360px);z-index:1;font-family:system-ui,sans-serif;pointer-events:auto;transform:translateZ(0)}
#featured-artwork .featured-frame{display:block;position:relative;aspect-ratio:4/5;overflow:hidden;background:rgba(255,250,242,.82);border:1px solid rgba(216,205,191,.95);border-radius:4px;text-decoration:none;color:var(--ink);cursor:default;box-shadow:0 22px 42px rgba(0,0,0,.18),0 6px 14px rgba(0,0,0,.10);backdrop-filter:blur(2px);transform:rotate(-1.25deg)}
#featured-artwork .featured-frame.is-linked{cursor:pointer}
#featured-artwork img{width:100%;height:100%;object-fit:contain;display:none}
#featured-artwork.has-image img{display:block}
#featured-artwork .featured-placeholder{position:absolute;inset:0;display:grid;place-items:center;padding:18px;color:var(--mut);text-align:center;font:italic 15px/1.5 Georgia,serif}
#featured-artwork.has-image .featured-placeholder{display:none}
#featured-artwork .featured-label{margin:12px 0 0 8px;font:600 12px/1.35 system-ui,sans-serif;letter-spacing:.035em;color:var(--ink)}
#featured-artwork .featured-title{margin:10px 0 0 8px;font:italic 16px/1.3 Georgia,serif;overflow-wrap:anywhere;text-shadow:0 1px 0 rgba(255,255,255,.35)}
#featured-artwork .featured-credit{margin:4px 0 0 8px;color:var(--mut);font-size:12px;overflow-wrap:anywhere;text-shadow:0 1px 0 rgba(255,255,255,.35)}
#featured-artwork [hidden]{display:none}
.prototype-brand{margin:0 0 20px;font:500 13px/1.45 system-ui,sans-serif;letter-spacing:.02em;color:var(--mut)}
.prototype-brand strong{display:block;font-weight:650;font-size:15px;color:var(--ink)}
#note{z-index:5}
@media(max-width:759px){#featured-artwork{top:24px;left:20px;width:clamp(160px,38vw,240px)}#featured-artwork .featured-frame{aspect-ratio:4/5}}
@media(max-height:480px){#featured-artwork{top:18px;left:18px;width:160px}}

/* Painterly sun < dense drifting clouds < transparent 3D world. */
#sky-sun{position:absolute;z-index:0;right:7%;top:2%;width:clamp(170px,24vw,360px);aspect-ratio:1;pointer-events:none;user-select:none;background-repeat:no-repeat;background-size:100% 100%;opacity:.98}
@media(max-width:759px){#sky-sun{top:0%;right:0%;width:clamp(150px,44vw,255px)}}
#sky-clouds{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}
#sky-clouds .sky-cloud{position:absolute;left:0;top:var(--cloud-y);width:var(--cloud-width);height:auto;
  opacity:var(--cloud-opacity);pointer-events:none;user-select:none;mix-blend-mode:normal;
  filter:blur(3.2px);
  transform:translate3d(-35vw,0,0);will-change:transform;
  animation:sky-cloud-drift var(--cloud-duration) linear infinite;
  animation-delay:var(--cloud-delay)}
@keyframes sky-cloud-drift{from{transform:translate3d(-55vw,0,0)}to{transform:translate3d(160vw,0,0)}}
@media(max-width:759px){#sky-sun{top:0%;right:0%;width:clamp(150px,44vw,255px)}}
@media(prefers-reduced-motion:reduce){#sky-clouds .sky-cloud{animation:none;transform:translate3d(var(--cloud-static-x),0,0)}}
/* Airborne lettering, independent letter movement, no pill or enclosing UI. */
#brick-prompt{position:absolute;left:65%;top:32%;z-index:3;
  transform:translate(-50%,-50%);
  display:inline-flex;align-items:center;justify-content:center;gap:.035em;
  padding:0;border:0;border-radius:0;background:none;box-shadow:none;backdrop-filter:none;
  font:900 clamp(14px,1.7vw,23px)/1.2 system-ui,-apple-system,Segoe UI,sans-serif;
  letter-spacing:.08em;text-transform:uppercase;color:#56321e;
  text-shadow:0 2px 0 rgba(255,239,210,.88),0 4px 12px rgba(55,36,20,.2),0 0 14px rgba(255,247,226,.55);
  white-space:nowrap;pointer-events:none;user-select:none;opacity:1;
  transition:opacity .33s ease;will-change:opacity,transform}
#brick-prompt.is-hidden{opacity:0}
#brick-prompt .brick-prompt-letter{display:inline-block;min-width:.50em;
  transform:translate3d(var(--lx,0px),var(--ly,0px),0) rotate(var(--lr,0deg));will-change:transform}
#brick-prompt .brick-prompt-letter.space{min-width:.69em}
@media(max-width:759px){#brick-prompt{font-size:14px;letter-spacing:.055em}}
@media(prefers-reduced-motion:reduce){#brick-prompt{transition:opacity .32s ease;transform:translate(-50%,-50%)}#brick-prompt .brick-prompt-letter{transform:none}}

/* Compact floating actions: no enclosing white menu card. */
aside {
  display:flex;
  flex-direction:column;
  gap:7px;
  top:16px;
  right:16px;
  width:min(232px,calc(100vw - 32px));
  max-height:calc(100dvh - 32px);
  padding:0;
  overflow-y:auto;
  overflow-x:visible;
  background:transparent;
  border:0;
  border-radius:0;
  box-shadow:none;
  backdrop-filter:none;
  pointer-events:none;
  scrollbar-width:thin;
  color:#33291f;
}
aside > * { pointer-events:auto; }
aside .prototype-brand {display:none;}
aside .actions {order:2;display:grid;gap:7px;margin:0;}
aside .actions button{
  width:100%;
  min-height:42px;
  padding:10px 13px;
  font:650 13px/1.2 system-ui,sans-serif;
  letter-spacing:.01em;
  border-radius:7px;
  text-align:left;
  justify-content:space-between;
  color:#251c18;
  background:#e47455;
  border:1px solid rgba(122,56,34,.23);
  box-shadow:0 4px 10px rgba(48,33,21,.14);
}
aside .actions button[aria-expanded="true"]{
  background:#bd563b;
  color:#fff9f2;
}
aside .panel {
  order:1;
  margin:0;
  padding:14px;
  background:rgba(255,250,243,.95);
  border:1px solid rgba(141,102,73,.35);
  border-radius:10px;
  box-shadow:0 10px 25px rgba(48,33,21,.14);
  color:#33291f;
  max-height:min(53dvh,420px);
  overflow:auto;
}
aside .panel[hidden]{display:none;}
aside .panel label {color:#554438;font-size:12px;}
aside input[type=text],
aside select,
aside textarea {
  background:#fffaf2 !important;
  color:#2b241e !important;
  border:1px solid #c9b39d !important;
  color-scheme:light;
  box-shadow:none;
  font:13px/1.35 system-ui,sans-serif;
}
aside input::placeholder,aside textarea::placeholder{color:#877d73;opacity:1;}
aside input:focus,aside select:focus,aside textarea:focus{
  outline:2px solid #e47455;
  outline-offset:1px;
  border-color:#d16b4b !important;
}
aside .chk {color:#352a22;}
aside #msg,aside #info,
aside .result-list button {background:#fffaf2;color:#352a22;border-color:#dcc5af;}
aside #admin-area {order:3;margin:2px 0 0;align-self:flex-end;max-width:100%;}
aside #admin-area summary {
  color:#5e4a3a;
  background:rgba(255,250,242,.7);
  padding:3px 7px;
  border-radius:5px;
  font-size:11px;
}
aside #admin-area[open]{
  align-self:stretch;
  padding:9px;
  border-radius:8px;
  background:rgba(255,250,242,.94);
  border:1px solid rgba(141,102,73,.3);
}
aside #admin-area button {font-size:11px;padding:7px 8px;}
@media(max-width:759px){
  aside{
    top:auto;
    bottom:max(12px,env(safe-area-inset-bottom));
    right:12px;
    width:min(224px,58vw);
    max-height:calc(80dvh - 16px);
    padding:0;
  }
  aside .actions button {min-height:42px;padding:10px 11px;font-size:12px;}
  aside .panel{max-height:47dvh;padding:12px;}
}

</style>
</head>
<body>
<div id="app">
  <div id="cv">
    <div id="sky-sun" aria-hidden="true"></div>
    <div id="sky-clouds" aria-hidden="true"></div>
    <section id="featured-artwork" aria-label="Featured community artwork">
      <a class="featured-frame" id="featured-artwork-link" aria-label="Featured artwork" tabindex="-1">
        <img id="featured-artwork-image" alt="">
        <span class="featured-placeholder">Featured artwork</span>
      </a>
      <p class="featured-label">Featured Artwork</p>
      <p class="featured-title" id="featured-artwork-title" hidden></p>
      <p class="featured-credit" id="featured-artwork-credit" hidden></p>
    </section>
    <div id="brick-prompt" aria-hidden="true" data-desktop-text="CLICK ON A BRICK" data-mobile-text="TAP ON A BRICK"></div><div id="count"></div><div id="note"></div></div>
  <aside>
    <p class="prototype-brand"><strong>CommunityArts Brick by Brick</strong>Prototype vers. 0.9a</p>
    <div class="actions" aria-label="Tower actions">
      <button id="toggle-add" type="button" aria-expanded="false" aria-controls="add-panel">Add Brick <span aria-hidden="true">+</span></button>
      <button id="toggle-find" type="button" aria-expanded="false" aria-controls="find-panel">Find Brick <span aria-hidden="true">⌕</span></button>
    </div>
    <section id="add-panel" class="panel" hidden>
      
      <label for="nm">Name</label><input id="nm" type="text" maxlength="40" autocomplete="name">
      <label for="af">Affiliation (optional)</label>
      <input id="af" type="text" maxlength="80" placeholder="Organisation, university or group">
      
      <label for="ms">Short message (optional)</label><textarea id="ms" maxlength="140"></textarea>
      <div class="chk"><input id="an" type="checkbox"><label for="an" style="margin:0;color:inherit">Keep me anonymous</label></div>
      <button id="add" type="button">Add my brick</button>
      <div id="msg" role="status"></div>
    </section>
    <section id="find-panel" class="panel" hidden>
      
      <label for="search-mode">Search by</label>
      <select id="search-mode"><option value="code">Brick code</option><option value="name">Contributor name</option></select>
      <label for="q" id="search-label">Brick code</label>
      <div class="row"><input id="q" type="text" placeholder="e.g. CA-7K2QX" aria-label="Brick code"><button id="go" type="button" class="ghost">Find</button></div>
      <div id="results" class="result-list" aria-live="polite"></div>
      <div id="info" role="status"></div>
    </section>
    <details id="admin-area">
      <summary>Tests</summary>
      <button id="appr" type="button" class="ghost">Demo: approve my pending bricks</button>
      <div class="row"><button id="more500" type="button" class="ghost">+500 bricks</button><button id="more2000" type="button" class="ghost">+2,000 bricks</button></div>
    </details>
  </aside>
</div>

<script>
// Original ez-tree source: enums.js
const Billboard = {
  Single: 'single',
  Double: 'double',
};

const TreeType = {
  Deciduous: 'deciduous',
  Evergreen: 'evergreen',
};
// Original ez-tree source: rng.js
class RNG {
  m_w = 123456789;
  m_z = 987654321;
  mask = 0xffffffff;

  constructor(seed) {
    this.m_w = (123456789 + seed) & this.mask;
    this.m_z = (987654321 - seed) & this.mask;
  }

  /**
   * Returns a random number between min and max
   */
  random(max = 1, min = 0) {
    this.m_z = (36969 * (this.m_z & 65535) + (this.m_z >> 16)) & this.mask;
    this.m_w = (18000 * (this.m_w & 65535) + (this.m_w >> 16)) & this.mask;
    let result = ((this.m_z << 16) + (this.m_w & 65535)) >>> 0;
    result /= 4294967296;

    return (max - min) * result + min;
  }
}

// Original ez-tree source: branch.js

class Branch {
  /**
   * Generates a new branch
   * @param {THREE.Vector3} origin The starting point of the branch
   * @param {THREE.Euler} orientation The starting orientation of the branch
   * @param {number} length The length of the branch
   * @param {number} radius The radius of the branch at its starting point
   */
  constructor(
    origin = new THREE.Vector3(),
    orientation = new THREE.Euler(),
    length = 0,
    radius = 0,
    level = 0,
    sectionCount = 0,
    segmentCount = 0,
  ) {
    this.origin = origin.clone();
    this.orientation = orientation.clone();
    this.length = length;
    this.radius = radius;
    this.level = level;
    this.sectionCount = sectionCount;
    this.segmentCount = segmentCount;
  }
}

// Original ez-tree source: options.js

class TreeOptions {
  constructor() {
    this.seed = 0;
    this.type = TreeType.Deciduous;

    // Bark parameters
    this.bark = {
      // Informational identifier carried through presets. The library does not
      // consume this field; the host app uses it to resolve which texture set
      // to assign to `maps` below.
      type: 'Bark001',

      // Texture maps supplied by the caller. Each entry is a THREE.Texture or
      // null. When `textured` is true, non-null maps are applied to the
      // material; null maps fall back to the tint color for that channel.
      maps: {
        color: null,
        ao: null,
        normal: null,
        roughness: null,
      },

      // Tint of the tree trunk
      tint: 0xffffff,

      // Use face normals for shading instead of vertex normals
      flatShading: false,

      // Apply texture to bark
      textured: true,

      // Scale for the texture
      textureScale: { x: 1, y: 1 },
    };

    // Branch parameters
    this.branch = {
      // Number of branch recursion levels. 0 = trunk only
      levels: 3,

      // Angle of the child branches relative to the parent branch (degrees)
      angle: {
        1: 70,
        2: 60,
        3: 60,
      },

      // Number of children per branch level
      children: {
        0: 7,
        1: 7,
        2: 5,
      },

      // External force encouraging tree growth in a particular direction
      force: {
        direction: { x: 0, y: 1, z: 0 },
        strength: 0.01,
      },

      // Amount of curling/twisting at each branch level
      gnarliness: {
        0: 0.15,
        1: 0.2,
        2: 0.3,
        3: 0.02,
      },

      // Length of each branch level
      length: {
        0: 20,
        1: 20,
        2: 10,
        3: 1,
      },

      // Radius of each branch level
      radius: {
        0: 1.5,
        1: 0.7,
        2: 0.7,
        3: 0.7,
      },

      // Number of sections per branch level
      sections: {
        0: 12,
        1: 10,
        2: 8,
        3: 6,
      },

      // Number of radial segments per branch level
      segments: {
        0: 8,
        1: 6,
        2: 4,
        3: 3,
      },

      // Defines where child branches start forming on the parent branch
      start: {
        1: 0.4,
        2: 0.3,
        3: 0.3,
      },

      // Taper at each branch level
      taper: {
        0: 0.7,
        1: 0.7,
        2: 0.7,
        3: 0.7,
      },

      // Amount of twist at each branch level
      twist: {
        0: 0,
        1: 0,
        2: 0,
        3: 0,
      },
    };

    // Leaf parameters
    this.leaves = {
      // Informational identifier (e.g. 'oak', 'ash'). Library does not consume
      // it; the host app uses it to resolve which texture to assign to `map`.
      type: 'oak',

      // Color map supplied by the caller. THREE.Texture or null.
      // When null, leaves render as a flat tinted quad.
      map: null,

      // Whether to use single or double/perpendicular billboards
      billboard: Billboard.Double,

      // Angle of leaves relative to parent branch (degrees)
      angle: 10,

      // Number of leaves
      count: 1,

      // Where leaves start to grow on the length of the branch (0 to 1)
      start: 0,

      // Size of the leaves
      size: 2.5,

      // Variance in leaf size between each instance
      sizeVariance: 0.7,

      // Tint color for the leaves
      tint: 0xffffff,

      // Controls transparency of leaf texture
      alphaTest: 0.5,

      // Calculates custom normals to imply a rounded canopy shape
      roundedNormals: true,
    };

    // Trellis parameters
    this.trellis = {
      // Whether trellis is enabled
      enabled: false,

      // Position of trellis (z is distance from tree)
      position: { x: 0, y: 0, z: -2 },

      // Width of trellis grid (X direction)
      width: 10,

      // Height of trellis grid (Y direction)
      height: 20,

      // Distance between grid lines
      spacing: 2,

      // Force parameters
      force: {
        // How strongly branches bend toward trellis
        strength: 0.02,
        // Maximum distance at which trellis affects branches
        maxDistance: 3,
        // Distance falloff exponent (1 = linear, 2 = quadratic)
        falloff: 1,
      },

      // Radius of trellis cylinders
      cylinderRadius: 0.05,

      // Whether to show trellis geometry

      t.cylinderRadius,
      t.height,
      8

      mesh.position.set(t.position.x, t.position.y + y, t.position.z);
      this.add(mesh);

    const trellisX = t.position.x;
    const trellisY = t.position.y;

    const pointOnVLine = new THREE.Vector3(finalVLineX, clampedY, trellisZ);

        this.options.branch.angle[level] / (180 / Math.PI),

        this.options.leaves.angle / (180 / Math.PI),
      );
      const q2 = new THREE.Quaternion().setFromAxisAngle(
        new THREE.Vector3(0, 1, 0),
        radialAngle,
      );
      const q3 = new THREE.Quaternion().setFromEuler(parentOrientation);

        q3.multiply(q2.multiply(q1)),

  }

  /**
  * Records a leaf placement in the skeleton. The size variance is sampled
  * here so the meshing passes stay RNG-free.
  * @param {THREE.Vector3} origin The starting point of the leaf
  * @param {THREE.Euler} orientation The orientation of the leaf
  */
  #recordLeaf(origin, orientation) {
    const size =
      this.options.leaves.size *
      (1 +
        this.rng.random(
          this.options.leaves.sizeVariance,
          -this.options.leaves.sizeVariance,
        ));

    this.skeleton.leaves.push({
      origin: origin.clone(),
      orientation: orientation.clone(),
      size,
    });
  }

  /**
  * Emits the quad geometry for one skeleton leaf into the buffers
  * @param {{verts: number[], normals: number[], indices: number[], uvs: number[]}} buffers
  * @param {{origin: THREE.Vector3, orientation: THREE.Euler, size: number}} leaf
  * @param {number} scale Size multiplier for this detail level
  * @param {string} billboard Billboard mode for this detail level
  */
  #meshLeaf(buffers, leaf, scale, billboard) {
    let i = buffers.verts.length / 3;

    const { origin, orientation } = leaf;

    // Width and length of the leaf quad
    const leafSize = leaf.size * scale;

    const W = leafSize;
    const L = leafSize;

    const createLeaf = (rotation) => {
      // Create quad vertices
      const v = [
        new THREE.Vector3(-W / 2, L, 0),
        new THREE.Vector3(-W / 2, 0, 0),
        new THREE.Vector3(W / 2, 0, 0),
        new THREE.Vector3(W / 2, L, 0),
      ].map((v) =>
        v
          .applyEuler(new THREE.Euler(0, rotation, 0))
          .applyEuler(orientation)
          .add(origin),
      );

      buffers.verts.push(
        v[0].x,
        v[0].y,
        v[0].z,
        v[1].x,
        v[1].y,
        v[1].z,
        v[2].x,
        v[2].y,
        v[2].z,
        v[3].x,
        v[3].y,
        v[3].z,
      );

      const n = new THREE.Vector3(0, 0, 1).applyEuler(orientation);

      // The normal vectors are an average of the direction of the leaf and the directions to the individual vertices.
      // This creates a nice rounded shape while maintaining the canopy shape as a whole.
      const roundedNormals = this.options.leaves.roundedNormals;
      let n1 = roundedNormals ? new THREE.Vector3().copy(n).add(v[0]).sub(origin).normalize() : n;
      let n2 = roundedNormals ? new THREE.Vector3().copy(n).add(v[1]).sub(origin).normalize() : n;
      let n3 = roundedNormals ? new THREE.Vector3().copy(n).add(v[2]).sub(origin).normalize() : n;
      let n4 = roundedNormals ? new THREE.Vector3().copy(n).add(v[3]).sub(origin).normalize() : n;

      buffers.normals.push(
        n1.x,
        n1.y,
        n1.z,
        n2.x,
        n2.y,
        n2.z,
        n3.x,
        n3.y,
        n3.z,
        n4.x,
        n4.y,
        n4.z,
      );
      buffers.uvs.push(0, 1, 0, 0, 1, 0, 1, 1);
      buffers.indices.push(i, i + 1, i + 2, i, i + 2, i + 3);
      i += 4;
    };

    createLeaf(0);
    if (billboard === Billboard.Double) {
      createLeaf(Math.PI / 2);
    }
  }

  /**
   * Fisher-Yates shuffle of [0..count-1] using the tree's RNG so results stay
   * seed-reproducible.
   * @param {number} count
   * @returns {number[]}
   */
  shuffledIndices(count) {
    const arr = Array.from({ length: count }, (_, k) => k);
    for (let k = count - 1; k > 0; k--) {
      const r = Math.floor(this.rng.random() * (k + 1));
      [arr[k], arr[r]] = [arr[r], arr[k]];
    }
    return arr;
  }

  /**
   * Emits the ring geometry and indices for one skeleton branch
   * @param {{verts: number[], normals: number[], indices: number[], uvs: number[]}} buffers
   * @param {{sections: {origin: THREE.Vector3, orientation: THREE.Euler, radius: number}[], segmentCount: number, baseRadius: number}} skeletonBranch
   * @param {number} sectionStride Sample every Nth section ring
   * @param {number} segmentFactor Radial segment multiplier
   */
  #meshBranch(buffers, skeletonBranch, sectionStride, segmentFactor) {
    const { sections, segmentCount, baseRadius } = skeletonBranch;

    // Terminal branches inherit the parent's segmentCount, so parent and
    // child resolve to the same reduced count and junctions stay sealed.
    const segments = Math.max(3, Math.round(segmentCount * segmentFactor));

    // Number of texture wraps around the branch's circumference. Scaling with
    // the branch's base radius keeps bark feature size roughly consistent
    // across thick trunks and thin twigs. Held constant for the whole branch
    // so tapered sections share a wrap count and don't twist the texture
    // longitudinally.
    const wrapsX = Math.max(
      1,
      Math.round(baseRadius * this.options.bark.textureScale.x),
    );

    // Sample every Nth ring, always keeping the first and last so branch
    // endpoints (and parent/child junctions) stay put across detail levels.
    const sampled = [];
    for (let i = 0; i < sections.length; i += sectionStride) {
      sampled.push(sections[i]);
    }
    if ((sections.length - 1) % sectionStride !== 0) {
      sampled.push(sections[sections.length - 1]);
    }

    // Used later for geometry index generation
    const indexOffset = buffers.verts.length / 3;

    for (let k = 0; k < sampled.length; k++) {
      const section = sampled[k];

      // Create the segments that make up this section.
      let first;
      for (let j = 0; j < segments; j++) {
        let angle = (2.0 * Math.PI * j) / segments;

        // Create the segment vertex
        const vertex = new THREE.Vector3(Math.cos(angle), 0, Math.sin(angle))
          .multiplyScalar(section.radius)
          .applyEuler(section.orientation)
          .add(section.origin);

        const normal = new THREE.Vector3(Math.cos(angle), 0, Math.sin(angle))
          .applyEuler(section.orientation)
          .normalize();

        // uv.y alternates by sampled ring position rather than original
        // section index, so section skipping keeps the 0/1 tiling pattern.
        const uv = new THREE.Vector2(
          (j / segments) * wrapsX,
          (k % 2 === 0) ? 0 : 1,
        );

        buffers.verts.push(...Object.values(vertex));
        buffers.normals.push(...Object.values(normal));
        buffers.uvs.push(...Object.values(uv));

        if (j === 0) {
          first = { vertex, normal, uv };
        }
      }

      // Duplicate the first vertex so there is continuity in the UV mapping.
      // u=wrapsX maps to the same texel as u=0 since wrapsX is an integer.
      buffers.verts.push(...Object.values(first.vertex));
      buffers.normals.push(...Object.values(first.normal));
      buffers.uvs.push(wrapsX, first.uv.y);
    }

    // Build geometry for each section of the branch (cylinder without end caps)
    let v1, v2, v3, v4;
    const N = segments + 1;
    for (let i = 0; i < sampled.length - 1; i++) {
      // Build the quad for each segment of the section
      for (let j = 0; j < segments; j++) {
        v1 = indexOffset + i * N + j;
        // The last segment wraps around back to the starting segment, so omit j + 1 term
        v2 = indexOffset + i * N + (j + 1);
        v3 = v1 + N;
        v4 = v2 + N;
        buffers.indices.push(v1, v3, v2, v2, v3, v4);
      }
    }
  }

  /**
   * Builds a BufferGeometry from raw attribute buffers
   * @param {{verts: number[], normals: number[], indices: number[], uvs: number[]}} buffers
   * @returns {THREE.BufferGeometry}
   */
  #buildBufferGeometry(buffers) {
    const g = new THREE.BufferGeometry();
    g.setAttribute(
      'position',
      new THREE.BufferAttribute(new Float32Array(buffers.verts), 3),
    );
    g.setAttribute(
      'normal',
      new THREE.BufferAttribute(new Float32Array(buffers.normals), 3),
    );
    g.setAttribute(
      'uv',
      new THREE.BufferAttribute(new Float32Array(buffers.uvs), 2),
    );
    g.setIndex(
      new THREE.BufferAttribute(new (buffers.verts.length/3 > 65535 ? Uint32Array : Uint16Array)(buffers.indices), 1),
    );
    g.computeBoundingSphere();
    return g;
  }

  /**
   * Creates the bark material from the current options
   * @returns {THREE.MeshStandardMaterial}
   */
  #createBarkMaterial() {
    const mat = new THREE.MeshStandardMaterial({
      name: 'branches',
      flatShading: this.options.bark.flatShading,
      color: new THREE.Color(this.options.bark.tint),
      metalness: 0.0,
      roughness: 1.0,
    });

    if (this.options.bark.textured) {
      // textureScale.x is baked into UVs during meshing (wrapsX), so only
      // the Y axis needs runtime scaling on the texture itself.
      const scale = this.options.bark.textureScale;
      const maps = this.options.bark.maps;
      const apply = (texture) => {
        if (!texture) return null;
        texture.wrapS = THREE.RepeatWrapping;
        texture.wrapT = THREE.RepeatWrapping;
        texture.repeat.x = 1;
        texture.repeat.y = 1 / scale.y;
        return texture;
      };
      if (maps.color) mat.map = apply(maps.color);
      if (maps.ao) mat.aoMap = apply(maps.ao);
      if (maps.normal) mat.normalMap = apply(maps.normal);
      if (maps.roughness) {
        mat.roughnessMap = apply(maps.roughness);
        // Point metalnessMap at the same texture: metalness stays 0 because
        // the metalness factor is 0, and GLTFExporter reuses the texture
        // as-is instead of synthesizing a merged metal/rough PNG (and
        // warning about it) when the two slots differ.
        mat.metalnessMap = mat.roughnessMap;
      }
    }

    return mat;
  }

  /**
   * Generates the geometry for the branches
   */
  createBranchesGeometry() {
    this.branchesMesh.geometry.dispose();
    this.branchesMesh.geometry = this.#buildBufferGeometry(this.branches);
    this.branchesMesh.material.dispose();
    this.branchesMesh.material = this.#createBarkMaterial();
    this.branchesMesh.castShadow = true;
    this.branchesMesh.receiveShadow = true;
  }

  /**
   * Creates the leaf material, including the wind sway vertex shader, from
   * the current options
   * @returns {THREE.MeshStandardMaterial}
   */
  #createLeafMaterial() {
    const mat = new THREE.MeshStandardMaterial({
      name: 'leaves',
      map: this.options.leaves.map ?? null,
      color: new THREE.Color(this.options.leaves.tint),
      side: THREE.DoubleSide,
      alphaTest: this.options.leaves.alphaTest,
      metalness: 0.0,
      roughness: 1.0,
      dithering: true
    });

    // Add custom shader code for branch swaying
    mat.onBeforeCompile = (shader) => {
      shader.uniforms.uTime = { value: 0 };
      shader.uniforms.uWindStrength = { value: new THREE.Vector3(0.5, 0, 0.5) };
      shader.uniforms.uWindFrequency = { value: 0.5 };
      shader.uniforms.uWindScale = { value: 70 };
      shader.uniforms.uCustomNormals = { value: this.options.leaves.roundedNormals };

      shader.vertexShader = `
        uniform float uTime;
        uniform vec3 uWindStrength;
        uniform float uWindFrequency;
        uniform float uWindScale;
        ` + shader.vertexShader;

      // Add code for simplex noise
      shader.vertexShader = shader.vertexShader.replace(
        `void main() {`,
        `
        // GLSL Simplex Noise 3D
        // Source: https://github.com/ashima/webgl-noise

        vec3 mod289(vec3 x) {
            return x - floor(x * (1.0 / 289.0)) * 289.0;
        }

        vec4 mod289(vec4 x) {
            return x - floor(x * (1.0 / 289.0)) * 289.0;
        }

        vec4 permute(vec4 x) {
            return mod289(((x*34.0)+1.0)*x);
        }

        vec4 taylorInvSqrt(vec4 r) {
            return 1.79284291400159 - 0.85373472095314 * r;
        }

        vec3 fade(vec3 t) {
            return t*t*t*(t*(t*6.0-15.0)+10.0);
        }

        // Classic Simplex Noise 3D
        float simplex3(vec3 v) {
            const vec2  C = vec2(1.0/6.0, 1.0/3.0);
            const vec4  D = vec4(0.0, 0.5, 1.0, 2.0);

            // First corner
            vec3 i  = floor(v + dot(v, C.yyy) );
            vec3 x0 = v - i + dot(i, C.xxx);

            // Other corners
            vec3 g = step(x0.yzx, x0.xyz);
            vec3 l = 1.0 - g;
            vec3 i1 = min( g.xyz, l.zxy );
            vec3 i2 = max( g.xyz, l.zxy );

            //  x0 = x0 - 0. + 0.0 * C 
            vec3 x1 = x0 - i1 + C.xxx;
            vec3 x2 = x0 - i2 + C.yyy; // 2.0 * C.x = 1/3 = C.y
            vec3 x3 = x0 - D.yyy;      // -1.0 + 3.0 * C.x = -0.5

            // Permutations
            i = mod289(i);
            vec4 p = permute( permute( permute( 
                        i.z + vec4(0.0, i1.z, i2.z, 1.0 ))
                      + i.y + vec4(0.0, i1.y, i2.y, 1.0 )) 
                      + i.x + vec4(0.0, i1.x, i2.x, 1.0 ));

            // Gradients: 7x7 points over a square, mapped onto an octahedron.
            // The ring size 17*17 = 289 is close to the mapping's singularity.
            float n_ = 0.142857142857; // 1.0/7.0
            vec3  ns = n_ * D.wyz - D.xzx;

            vec4 j = p - 49.0 * floor(p * ns.z * ns.z);  //  mod(p,7*7)

            vec4 x_ = floor(j * ns.z);
            vec4 y_ = floor(j - 7.0 * x_ );    // mod(j,N)

            vec4 x = x_ *ns.x + ns.yyyy;
            vec4 y = y_ *ns.x + ns.yyyy;
            vec4 h = 1.0 - abs(x) - abs(y);

            vec4 b0 = vec4( x.xy, y.xy );
            vec4 b1 = vec4( x.zw, y.zw );

            vec4 s0 = floor(b0)*2.0 + 1.0;
            vec4 s1 = floor(b1)*2.0 + 1.0;
            vec4 sh = -step(h, vec4(0.0));

            vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy ;
            vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww ;

            vec3 g0 = vec3(a0.xy,h.x);
            vec3 g1 = vec3(a0.zw,h.y);
            vec3 g2 = vec3(a1.xy,h.z);
            vec3 g3 = vec3(a1.zw,h.w);

            // Normalise gradients
            vec4 norm = taylorInvSqrt(vec4(dot(g0,g0), dot(g1,g1), dot(g2,g2), dot(g3,g3)));
            g0 *= norm.x;
            g1 *= norm.y;
            g2 *= norm.z;
            g3 *= norm.w;

            // Mix contributions from the four corners
            vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
            m = m * m;
            return 42.0 * dot( m*m, vec4( dot(g0,x0), dot(g1,x1), 
                                          dot(g2,x2), dot(g3,x3) ) );
        }
          
        void main() {`,
      );

      shader.vertexShader = shader.vertexShader.replace(
        `#include <project_vertex>`,
        `
        vec4 mvPosition = vec4(transformed, 1.0);

        float windOffset = 2.0 * 3.14 * simplex3(mvPosition.xyz / uWindScale);
        vec3 windSway = uv.y * uWindStrength * (
          0.5 * sin(uTime * uWindFrequency + windOffset) +
          0.3 * sin(2.0 * uTime * uWindFrequency + 1.3 * windOffset) +
          0.2 * sin(5.0 * uTime * uWindFrequency + 1.5 * windOffset)
        );
        mvPosition.xyz += windSway;

        mvPosition = modelViewMatrix * mvPosition;
        gl_Position = projectionMatrix * mvPosition;
        `
      );

      // Skip the backface normal flip in normal_fragment_begin when using custom normals
      shader.fragmentShader = `uniform bool uCustomNormals;\n` + shader.fragmentShader.replace(
        '#include <normal_fragment_begin>',
        THREE.ShaderChunk.normal_fragment_begin.replace(
          'normal *= faceDirection;',
          'if (!uCustomNormals) { normal *= faceDirection; }'
        )
      );

      // Non-enumerable so JSON serialization (e.g. GLTFExporter's userData
      // pass) skips the live shader object — Texture uniforms inside it are
      // not serializable. update() still reads userData.shader normally.
      Object.defineProperty(mat.userData, 'shader', {
        value: shader,
        configurable: true,
        enumerable: false,
      });
    };

    return mat;
  }

  /**
   * Generates the geometry for the leaves
   */
  createLeavesGeometry() {
    this.leavesMesh.geometry.dispose();
    this.leavesMesh.geometry = this.#buildBufferGeometry(this.leaves);
    this.leavesMesh.material.dispose();
    this.leavesMesh.material = this.#createLeafMaterial();
    this.leavesMesh.castShadow = true;
    this.leavesMesh.receiveShadow = true;
  }

  /**
   * Create or update the trellis geometry
   */
  createTrellis() {
    // Remove old trellis if exists
    if (this.trellisMesh) {
      this.remove(this.trellisMesh);
      this.trellisMesh.dispose();
      this.trellisMesh = null;
    }

    // Create new trellis if enabled and visible
    if (this.options.trellis.enabled && this.options.trellis.visible) {
      this.trellisMesh = new Trellis(this.options.trellis);
      this.trellisMesh.generate();
      this.add(this.trellisMesh);
    }
  }

  /**
   * Find the nearest point on the trellis grid to a given position
   * @param {THREE.Vector3} position
   * @returns {THREE.Vector3}
   */
  getNearestTrellisPoint(position) {
    const t = this.options.trellis;
    const trellisX = t.position.x;
    const trellisY = t.position.y;
    const trellisZ = t.position.z;

    // Trellis bounds
    const minX = trellisX - t.width / 2;
    const maxX = trellisX + t.width / 2;
    const minY = trellisY;
    const maxY = trellisY + t.height;

    // Clamp position to trellis bounds for projection
    const clampedX = Math.max(minX, Math.min(maxX, position.x));
    const clampedY = Math.max(minY, Math.min(maxY, position.y));

    // Find nearest horizontal line (Y = constant)
    const nearestHLineY = Math.round((clampedY - minY) / t.spacing) * t.spacing + minY;
    const finalHLineY = Math.max(minY, Math.min(maxY, nearestHLineY));

    // Find nearest vertical line (X = constant)
    const nearestVLineX = Math.round((clampedX - minX) / t.spacing) * t.spacing + minX;
    const finalVLineX = Math.max(minX, Math.min(maxX, nearestVLineX));

    // Point on nearest horizontal line (X can vary along the line)
    const pointOnHLine = new THREE.Vector3(clampedX, finalHLineY, trellisZ);

    // Point on nearest vertical line (Y can vary along the line)
    const pointOnVLine = new THREE.Vector3(finalVLineX, clampedY, trellisZ);

    // Return whichever is closer
    const distH = position.distanceTo(pointOnHLine);
    const distV = position.distanceTo(pointOnVLine);

    return distH < distV ? pointOnHLine : pointOnVLine;
  }

  /**
   * Calculate the force vector toward the nearest trellis point
   * @param {THREE.Vector3} position Current section position
   * @param {number} radius Current section radius
   * @returns {{ direction: THREE.Vector3, strength: number } | null}
   */
  calculateTrellisForce(position, radius) {
    const trellis = this.options.trellis;
    const nearestPoint = this.getNearestTrellisPoint(position);

    const distance = position.distanceTo(nearestPoint);

    // Only apply force within max distance
    if (distance > trellis.force.maxDistance) return null;
    if (distance < 0.001) return null; // Avoid division by zero

    // Calculate direction toward trellis
    const direction = new THREE.Vector3()
      .subVectors(nearestPoint, position)
      .normalize();

    // Calculate strength with distance falloff
    // Closer = stronger force, scaled by inverse radius (like existing force)
    const distanceFactor = 1 - Math.pow(
      distance / trellis.force.maxDistance,
      trellis.force.falloff,
    );
    const strength = trellis.force.strength * distanceFactor / radius;

    return { direction, strength };
  }

  get vertexCount() {
    return (this.branches.verts.length + this.leaves.verts.length) / 3;
  }

  get triangleCount() {
    return (this.branches.indices.length + this.leaves.indices.length) / 3;
  }
}

// After password-protected admin authentication, the Journal admin should save
// ONE public featured-artwork record to its database. The tower READS the public
// record; it must never expose the admin password, service-role key or write API.
// Set window.TOWER_FEATURED_ARTWORK_ENDPOINT to a public read-only JSON endpoint
// in a script loaded BEFORE this one, e.g. /functions/v1/featured-artwork.
// Expected JSON: {"image_url":"https://...","title":"...","artist":"...","journal_url":"https://..."}.
// For immediate client-side previews, call window.setTowerFeaturedArtwork(record).
// A real cross-device change requires the shared endpoint (not localStorage).
(function setupFeaturedArtwork(){
  const panel=document.getElementById('featured-artwork');
  const img=document.getElementById('featured-artwork-image');
  const link=document.getElementById('featured-artwork-link');
  const title=document.getElementById('featured-artwork-title');
  const credit=document.getElementById('featured-artwork-credit');
  function safeUrl(value){
    if(typeof value!=='string'||!value.trim())return '';
    try{const url=new URL(value,location.href);return ['https:','http:'].includes(url.protocol)?url.href:''}catch{return ''}
  }
  window.setTowerFeaturedArtwork=function(record){
    const data=record?.featured_artwork||record?.data||record||{};
    const imageUrl=safeUrl(data.image_url||data.imageUrl||data.image);
    const journalUrl=safeUrl(data.journal_url||data.journalUrl||data.url);
    img.onload=()=>{panel.classList.add('has-image')};
    img.onerror=()=>{panel.classList.remove('has-image');img.removeAttribute('src')};
    panel.classList.remove('has-image');
    if(imageUrl){img.alt=String(data.alt||data.title||'Featured community artwork');img.src=imageUrl}
    else{img.removeAttribute('src');img.alt=''}
    title.textContent=String(data.title||'');
    credit.textContent=String(data.artist||data.credit||'');
    title.hidden=!title.textContent;
    credit.hidden=!credit.textContent;
    if(journalUrl&&imageUrl){link.href=journalUrl;link.target='_blank';link.rel='noopener noreferrer';link.classList.add('is-linked');link.removeAttribute('tabindex')}
    else{link.removeAttribute('href');link.removeAttribute('target');link.classList.remove('is-linked');link.setAttribute('tabindex','-1')}
  };
  async function refreshFeaturedArtwork(){

const grassU={uTime:{value:0},uNoiseScale:{value:1.5},uBase:{value:new THREE.Color("#313f1b")},uTip1:{value:new THREE.Color("#9bd38d")},
  uTip2:{value:new THREE.Color("#1f352a")},uNoise:{value:grassNoiseTex},uAlpha:{value:grassAlphaTex},uSun:{value:SUN},

  vertexShader:`
    uniform float uTime,uNoiseScale,uTowerH,uTowerR,uField,uHeightMul;
    uniform sampler2D uNoise;
    uniform vec3 uSun;
    varying vec2 vUv,vGlobalUV;
    varying float vShadow,vFieldD,vSeedG;
    void main(){
      vec4 mp=modelMatrix*instanceMatrix*vec4(position,1.0);
      vSeedG=fract(sin(dot((modelMatrix*instanceMatrix*vec4(0.0,0.0,0.0,1.0)).xz,vec2(12.9898,78.233)))*43758.5453);
      // Variable heights per clump, with a low, gently tapered ring around the tower.
      // Keep the lowest brick courses readable without creating a bare circle.
      vec3 org=(modelMatrix*instanceMatrix*vec4(0.0,0.0,0.0,1.0)).xyz;
      float radius=length(org.xz);
      float rim=smoothstep(uTowerR+0.35,uTowerR+4.6,radius);
      float patches=texture2D(uNoise,(org.xz+vec2(23.0))/33.0).r;
      float tuftHeight=0.72+0.62*vSeedG+0.26*(patches-0.5);
      float heightScale=mix(0.16+vSeedG*0.085,tuftHeight,rim)*uHeightMul;
      mp.xyz=org+(mp.xyz-org)*heightScale;
      // Natural variable-height grass is kept across the meadow. Only the tower's
      // immediate base remains low to reveal the first brick courses.
      // Cast shadow of the tower: does the ray from this blade towards the sun pass through the tower?
      vec2 d2=normalize(uSun.xz);float tanE=uSun.y/length(uSun.xz);
      float tc=-dot(mp.xz,d2);
      float hh=length(mp.xz+d2*tc);
      float te=tc-sqrt(max(uTowerR*uTowerR-hh*hh,0.0));
      float lateral=tc>0.0?1.0-smoothstep(uTowerR-0.5,uTowerR+0.5,hh):0.0;
      vShadow=lateral*(1.0-smoothstep(uTowerH-0.25,uTowerH+0.35,mp.y+te*tanE));
      vFieldD=length(mp.xz)/uField;
      // Wind (as in the repo): sine wave bent by scrolling Perlin noise, scaled by (1-uv.y) so roots stay put.
      float terrainSize=40.0;
      vGlobalUV=(terrainSize-mp.xz)/terrainSize;
      vec4 noise=texture2D(uNoise,vGlobalUV+uTime*0.001);
      float wave=sin(50.0*dot(normalize(vec2(1.0,1.0)),vGlobalUV)+noise.g*5.5+uTime)*0.07*(1.0-uv.y);
      mp.x+=wave;mp.z+=wave;
      mp.y+=exp(texture2D(uNoise,vGlobalUV*uNoiseScale).r)*0.22*heightScale*(1.0-uv.y);

      float li=floor(vUv.x*16.0);

      col+=vec3(1.0,0.88,0.66)*0.28*smoothstep(0.4,1.0,vUv.y); // the sun is behind: tips catch a warm glow

  if(rotTarget!==null){const d=((rotTarget-rot+Math.PI)%TAU+TAU)%TAU-Math.PI;rot+=d*.08;if(Math.abs(d)<.002){rotTarget=null;if(scrollT!==null)off=rot-scrollT}}
  else if(scrollT!==null){rot+=(scrollT+off-rot)*.08}else if(!drag)rot+=spin;
  tower.rotation.y=rot;
  camY+=(camTarget-camY)*.06;
  const mobileView=cv.clientWidth<760 || cv.clientHeight>cv.clientWidth*1.22;
  cam.position.set(0,camY+(mobileView?.40:.18),camDistance);
  cam.lookAt(0,camY+(mobileView?.06:0),0);
  {const dz=camDistance+60,hh=Math.tan(THREE.MathUtils.degToRad(cam.fov/2))*dz;
   if(mobileView){
     // Place the sun using viewport coordinates so portrait view offsets
     // cannot accidentally push it off the left side of the screen.
     cam.updateMatrixWorld(true);
     const target=new THREE.Vector3(.62,.73,.85).unproject(cam);
     const line=target.sub(cam.position);
     const t=(-60-cam.position.z)/line.z;
     sunDisc.position.copy(cam.position).addScaledVector(line,t);
     sunDisc.scale.setScalar(hh*.95);
   }else{
     sunDisc.position.set(hh*cam.aspect*(.62-2*TOWER_SHIFT),camY+.18+hh*.56,-60);
     sunDisc.scale.setScalar(hh*1.05);
   }}
  grassU.uTime.value=t/1000;oakWindTime.value=t/1000;gm.visible=camY<13;
  updateBrickPrompt(t/1000);
  updateInteraction(t);
  const pulse=.2+.5*(.5+.5*Math.sin(t/300));
  for(const kind of ["plain","check","stripe"]){const g=groups[kind+":pending"];if(g.entries.length)g.material.emissiveIntensity=pulse}
  if(painterEnabled){ren.setRenderTarget(rt);ren.render(scene,cam);
    ren.setRenderTarget(null);ren.render(postScene,postCam);
  }else ren.render(scene,cam);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
cv.addEventListener("pointerdown",e=>{drag={x:e.clientX,y:e.clientY};moved=0;rotTarget=null;cv.setPointerCapture(e.pointerId)});
cv.addEventListener("pointermove",e=>{ptr.x=e.clientX;ptr.y=e.clientY;ptr.on=true;hoverDirty=true;if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;moved+=Math.abs(dx)+Math.abs(dy);if(scrollT!==null)off+=dx*.008;else rot+=dx*.008;drag={x:e.clientX,y:e.clientY}});
cv.addEventListener("pointerup",e=>{if(drag&&moved<(e.pointerType==='touch'?13:5))handleClick(e);drag=null});
cv.addEventListener("pointerleave",()=>{ptr.on=false;hoverDirty=true});
cv.addEventListener("pointercancel",()=>{drag=null});
// ── Hover, push-out, float and crumble ───────────────────────────────────────────────────────────
// Hover: the brick under the pointer blinks slowly with a white outline.
// Click: it is shoved out from the inside, leaves a gap, and floats to the empty left of the screen with its note.
// Click anywhere else: it crumbles, and the brick reappears in its place in the tower.
const ptr={x:0,y:0,on:false};let hoverDirty=false,lastPick=0,hovered=null,sel=null,lastT=0,lastHoverRot=0;
const noteEl=$("note");
const hoverMat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,side:THREE.FrontSide,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2,
  uniforms:{uPulse:{value:1}},
  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader:`varying vec2 vUv;uniform float uPulse;
    float h(vec2 p){p=fract(p*vec2(123.34,345.45));p+=dot(p,p+34.345);return fract(p.x*p.y);}
    float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);return mix(mix(h(i),h(i+vec2(1.0,0.0)),f.x),mix(h(i+vec2(0.0,1.0)),h(i+vec2(1.0,1.0)),f.x),f.y);}
    void main(){
      vec2 p=vUv*2.0-1.0;
      float d=max(abs(p.x)-0.862,abs(p.y)-0.746)+(n(p*vec2(6.0,4.0))-0.5)*0.03;
      float a=(1.0-smoothstep(0.035,0.07,abs(d+0.04)))*uPulse;
      if(a<0.02)discard;
      gl_FragColor=vec4(vec3(1.0),a);
    }`});
const hoverMesh=new THREE.Mesh(new THREE.PlaneGeometry(BW*1.16,BH*1.34),hoverMat);
hoverMesh.visible=false;hoverMesh.renderOrder=5;hoverMesh.frustumCulled=false;tower.add(hoverMesh);

const _ray=new THREE.Raycaster(),_v2=new THREE.Vector2(),_p=new THREE.Vector3(),_q=new THREE.Quaternion(),_q2=new THREE.Quaternion(),_e=new THREE.Euler(),_m=new THREE.Matrix4(),_s=new THREE.Vector3();
const eo3=u=>1-Math.pow(1-u,3),eio=u=>u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2,eob=u=>1+2.70158*Math.pow(u-1,3)+1.70158*Math.pow(u-1,2);
function setRay(cx,cy){const r=cv.getBoundingClientRect();_v2.set((cx-r.left)/r.width*2-1,-(cy-r.top)/r.height*2+1);_ray.setFromCamera(_v2,cam)}
function pickAt(cx,cy,touch=false){
  tower.updateMatrixWorld(true);
  const meshes=tower.children.filter(x=>x.userData.group&&x.userData.group.mesh===x);
  const offsets=touch?[[0,0],[0,-12],[-12,0],[12,0],[0,12],[-9,-9],[9,-9],[-9,9],[9,9]]:[[0,0]];
  let winner=null;
  for(const [dx,dy] of offsets){
    setRay(cx+dx,cy+dy);
    const hit=_ray.intersectObjects(meshes,false)[0];
    if(!hit||hit.instanceId===undefined)continue;
    const b=hit.object.userData.group.entries[hit.instanceId];
    if(!b)continue;
    const score=Math.hypot(dx,dy)*.018+hit.distance*.0005;
    if(!winner||score<winner.score){
      const lp=tower.worldToLocal(hit.point.clone());
      winner={b,side:Math.hypot(lp.x,lp.z)>R?1:-1,score};
    }
    if(dx===0&&dy===0)break;
  }
  return winner;
}
function setHover(h){
  hovered=h?h.b:null;
  if(!h){hoverMesh.visible=false;cv.classList.remove("pick");return}
  const p=h.b.p,off=h.side*(BD/2+.06);
  hoverMesh.position.set(p.x+Math.cos(p.a)*off,p.y,p.z+Math.sin(p.a)*off);
  hoverMesh.rotation.set(0,h.side>0?p.ry+Math.PI:p.ry,0);
  hoverMesh.visible=true;cv.classList.add("pick");
}
function showInstance(b,k){
  const g=b.group;if(!g)return;const i=b.instanceIndex,p=b.p;
  dummy.position.set(p.x,p.y,p.z);dummy.rotation.set(0,p.ry,0);dummy.scale.setScalar(Math.max(k,1e-4));dummy.updateMatrix();
  g.mesh.setMatrixAt(i,dummy.matrix);g.overlay.setMatrixAt(i,dummy.matrix);
  g.mesh.instanceMatrix.needsUpdate=true;g.overlay.instanceMatrix.needsUpdate=true;
}
// The floating copy keeps its original tower-space instance matrix (so its strokes stay put on the brick) and is moved
// by the object's own matrix: world = object * instance.
function makeTraveler(b,M0){
  const g=b.group,m=new THREE.InstancedMesh(geo,g.material,1),o=new THREE.InstancedMesh(inkPlane.clone(),inkMaterial,1);
  const col=g.kind==="plain"?brickColour(b.id):new THREE.Color(1,1,1);
  m.instanceColor=new THREE.InstancedBufferAttribute(new Float32Array([col.r,col.g,col.b]),3);
  m.setMatrixAt(0,M0);o.setMatrixAt(0,M0);
  o.geometry.setAttribute("aSeed",new THREE.InstancedBufferAttribute(new Float32Array([(hash(b.id)%10000)/10000]),1));
  o.geometry.setAttribute("aInkColor",new THREE.InstancedBufferAttribute(new Float32Array([col.r,col.g,col.b]),3));
  for(const x of [m,o]){x.frustumCulled=false;x.matrixAutoUpdate=false;scene.add(x)}
  return{m,o};
}
function disposeTraveler(tv){scene.remove(tv.m);scene.remove(tv.o);tv.m.dispose();tv.o.geometry.dispose();tv.o.dispose()}
function placeTraveler(pos,quat,scale){
  _m.compose(pos,quat,_s.setScalar(scale));const tv=sel.tv;
  tv.m.matrix.copy(_m).multiply(sel.inv);tv.o.matrix.copy(tv.m.matrix);tv.m.matrixWorldNeedsUpdate=tv.o.matrixWorldNeedsUpdate=true;
  sel.curP.copy(pos);sel.curQ.copy(quat);sel.curS=scale;
}
let floatScale=1.5;
function floatPos(){   // centre of the empty left of the screen, on a plane in front of the tower; also sets the brick's size
  cam.updateMatrixWorld();const o=cam.position,d=new THREE.Vector3(SCREEN_LEFT-1,.10,.5).unproject(cam).sub(o).normalize();
  const dF=camDistance*.6;floatScale=.24*2*dF*Math.tan(THREE.MathUtils.degToRad(cam.fov/2))*cam.aspect/BW;
  return o.clone().addScaledVector(d,-dF/d.z);
}
function floatQuat(el,out){return out.setFromEuler(_e.set(.08*Math.sin(el*.9),Math.PI+el*.55,.05*Math.sin(el*.7),"YXZ"))}   // a slow turntable, so every face gets its turn in the light
function startSel(b,t){
  if(!b.group||sel)return;setHover(null);tower.updateMatrixWorld(true);
  const M0=matrixFor(b.p).clone(),W0=new THREE.Matrix4().multiplyMatrices(tower.matrixWorld,M0);
  const s={b,phase:"out",t0:t,p0:new THREE.Vector3(),q0:new THREE.Quaternion(),
    dir:new THREE.Vector3(Math.cos(b.p.a),0,Math.sin(b.p.a)).transformDirection(tower.matrixWorld),inv:M0.clone().invert(),
    fromP:new THREE.Vector3(),fromQ:new THREE.Quaternion(),curP:new THREE.Vector3(),curQ:new THREE.Quaternion(),curS:1,tv:null,deb:null};
  W0.decompose(s.p0,s.q0,_s);s.tv=makeTraveler(b,M0);sel=s;showInstance(b,0);placeTraveler(s.p0,s.q0,1);
}
function showNote(b){
  const who=b.anon||!b.name?"Anonymous":b.name;
  noteEl.innerHTML=(b.msg?'<span class="msg">“'+esc(b.msg)+'”</span>':'')+'<span class="by">— <b>'+esc(who)+'</b>'+(b.aff&&b.aff!=="None"?" · "+esc(b.aff):"")+'</span><span class="nid">'+esc(b.id)+'</span>';
  noteEl.classList.add("on");posNote();
}
function hideNote(){noteEl.classList.remove("on")}
function posNote(){
  if(!sel)return;const v=sel.curP.clone().project(cam),w=cv.clientWidth,h=cv.clientHeight;
  const pxu=h/2/(Math.tan(THREE.MathUtils.degToRad(cam.fov/2))*cam.position.distanceTo(sel.curP));
  const hw=(noteEl.offsetWidth||280)/2+8,x=Math.min(Math.max((v.x*.5+.5)*w,hw),w-hw),y=(-v.y*.5+.5)*h+BH*sel.curS*.5*pxu+22;
  noteEl.style.transform="translate("+x.toFixed(1)+"px,"+y.toFixed(1)+"px) translateX(-50%) rotate(-1.2deg)";
}
function makeDebris(b,pos,quat,scale){
  const n=20,mesh=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshLambertMaterial({color:0xffffff}),n),pieces=[],c=new THREE.Color();
  const k=b.group.kind,base=k==="plain"?brickColour(b.id):new THREE.Color(k==="check"?0x222222:0x2f8f4e),alt=k==="plain"?base:new THREE.Color(1,1,1);
  mesh.instanceColor=new THREE.InstancedBufferAttribute(new Float32Array(n*3),3);
  for(let i=0;i<n;i++){
    c.copy(i%3===0?alt:base).multiplyScalar(.75+Math.random()*.5);mesh.setColorAt(i,c);
    const lp=new THREE.Vector3((Math.random()-.5)*BW,(Math.random()-.5)*BH,(Math.random()-.5)*BD).multiplyScalar(scale).applyQuaternion(quat);
    pieces.push({p:pos.clone().add(lp),v:new THREE.Vector3((Math.random()-.5)*2.4,1.2+Math.random()*2.4,(Math.random()-.2)*2.2).add(lp.clone().multiplyScalar(.8)),
      r:new THREE.Euler(Math.random()*6,Math.random()*6,Math.random()*6),w:new THREE.Vector3(Math.random()*8-4,Math.random()*8-4,Math.random()*8-4),s:(.10+Math.random()*.24)*scale*.55});
  }
  mesh.frustumCulled=false;scene.add(mesh);return{mesh,pieces};
}
function updateDebris(d,dt,u){
  const fade=1-Math.max(0,(u-.55)/.45);
  d.pieces.forEach((q,i)=>{
    q.v.y-=9*dt;q.p.addScaledVector(q.v,dt);
    if(q.p.y<.05){q.p.y=.05;q.v.y*=-.25;q.v.x*=.7;q.v.z*=.7;q.w.multiplyScalar(.8)}
    q.r.x+=q.w.x*dt;q.r.y+=q.w.y*dt;q.r.z+=q.w.z*dt;
    dummy.position.copy(q.p);dummy.rotation.copy(q.r);dummy.scale.setScalar(q.s*fade+1e-4);dummy.updateMatrix();d.mesh.setMatrixAt(i,dummy.matrix);
  });
  d.mesh.instanceMatrix.needsUpdate=true;
}
function disposeDebris(d){scene.remove(d.mesh);d.mesh.geometry.dispose();d.mesh.material.dispose();d.mesh.dispose()}
function startCrumble(t){
  const s=sel;if(!s||s.phase==="crumble"||s.phase==="return")return;
  hideNote();s.deb=makeDebris(s.b,s.curP,s.curQ,s.curS);disposeTraveler(s.tv);s.tv=null;s.phase="crumble";s.t0=t;
}
function handleClick(e){
  const t=performance.now();
  if(!sel){const h=pickAt(e.clientX,e.clientY,e.pointerType==='touch'||e.pointerType==='pen');if(h)startSel(h.b,t);return}
  if(sel.phase==="crumble"||sel.phase==="return")return;
  setRay(e.clientX,e.clientY);
  if(sel.tv&&_ray.intersectObject(sel.tv.m,false).length)return;   // the floating brick itself: nothing happens
  startCrumble(t);                                                  // anywhere else: crumble
}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&sel)startCrumble(performance.now())});
function stepSel(t,dt){
  const s=sel,el=(t-s.t0)/1000;
  if(s.phase==="out"){           // shoved out from the inside: a quick punch, a little shudder, then it settles
    const u=Math.min(el/.75,1),d=1.35*eo3(u),w=.16*Math.sin(u*Math.PI*3)*(1-u);
    _p.copy(s.p0).addScaledVector(s.dir,d);_q.copy(s.q0).multiply(_q2.setFromEuler(_e.set(w*.6,w,w*.8)));
    placeTraveler(_p,_q,1);
    if(u>=1){s.phase="fly";s.t0=t;s.fromP.copy(_p);s.fromQ.copy(_q)}
  }else if(s.phase==="fly"){     // up and across to the empty left of the screen, growing as it comes forward
    const u=Math.min(el/1.5,1),e=eio(u),tp=floatPos();
    _p.copy(s.fromP).lerp(tp,e);_p.y+=Math.sin(Math.PI*u)*.45;
    _q.copy(s.fromQ).slerp(floatQuat(0,_q2),e);
    placeTraveler(_p,_q,1+(floatScale-1)*e);
    if(u>=1){s.phase="float";s.t0=t;showNote(s.b)}
  }else if(s.phase==="float"){
    _p.copy(floatPos());_p.y+=.10*floatScale*Math.sin(el*1.3);_p.x+=.04*floatScale*Math.sin(el*.8);
    placeTraveler(_p,floatQuat(el,_q),floatScale);posNote();
  }else if(s.phase==="crumble"){
    const u=Math.min(el/1.1,1);updateDebris(s.deb,dt,u);
    if(u>=1){disposeDebris(s.deb);s.deb=null;s.phase="return";s.t0=t}
  }else if(s.phase==="return"){   // the brick drops back into its place in the tower
    const u=Math.min(el/.5,1);showInstance(s.b,eob(u));
    if(u>=1){showInstance(s.b,1);sel=null}
  }
}
function updateInteraction(t){
  const dt=Math.min(.05,Math.max(0,(t-lastT)/1000));lastT=t;
  hoverMat.uniforms.uPulse.value=.25+.75*(.5+.5*Math.sin(t/1000*2.4));   // slow blink
  if(sel){if(hovered||hoverMesh.visible)setHover(null);stepSel(t,dt);return}
  if(ptr.on&&Math.abs(rot-lastHoverRot)>.0015){lastHoverRot=rot;hoverDirty=true}
  if(hoverDirty&&t-lastPick>60){hoverDirty=false;lastPick=t;setHover(ptr.on&&!drag?pickAt(ptr.x,ptr.y):null)}
}
function esc(s){return String(s??"").replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function show(b){openPanel("find");const who=b.anon||!b.name?"Anonymous":esc(b.name);
  $("info").innerHTML="<strong>"+who+"</strong>"+(b.status==="pending"?'<span class="tag">awaiting approval</span>':"")+
    (b.aff&&b.aff!=="None"?"<br>"+esc(b.aff):"")+(b.msg?"<br><em>“"+esc(b.msg)+"”</em>":"")+
    '<br><span class="id">'+esc(b.id)+"</span> · layer "+(b.p.layer+1);
}
$("add").onclick=()=>{const anon=$("an").checked,name=$("nm").value.trim();if(!anon&&!name){$("msg").textContent="Please add a name, or tick anonymous.";return}
  const b={id:newId(),name:anon?"":name,anon,aff:$("af").value,msg:$("ms").value.trim(),status:"pending",mine:true};
  addBrick(b);saveMine();focus(b);$("info").replaceChildren();
  $("msg").innerHTML="Your brick is in the tower. Your ID is <strong class='id'>"+b.id+"</strong> – keep it to find your brick again. It glows while it waits to be reviewed, then joins the public tower.";
  $("nm").value="";$("af").value="";$("ms").value="";
};
function openPanel(which){
  for(const key of ["add","find"]){const active=key===which,button=$("toggle-"+key);$(key+"-panel").hidden=!active;button.setAttribute("aria-expanded",String(active));}
}
for(const key of ["add","find"]){$("toggle-"+key).onclick=()=>{const isOpen=$("toggle-"+key).getAttribute("aria-expanded")==="true";openPanel(isOpen?null:key)}}
$("search-mode").onchange=()=>{const byName=$("search-mode").value==="name";$("search-label").textContent=byName?"Contributor name":"Brick code";$("q").placeholder=byName?"Enter a contributor's name":"e.g. CA-7K2QX";$("q").setAttribute("aria-label",byName?"Contributor name":"Brick code");$("q").value="";$("results").replaceChildren();$("info").replaceChildren()};
$("go").onclick=()=>{
  const query=$("q").value.trim();$("results").replaceChildren();$("info").replaceChildren();
  if(!query){$("info").textContent="Enter a brick code or contributor name.";return}
  if($("search-mode").value==="code"){
    const b=byId.get(query.toUpperCase());if(!b){$("info").textContent="No brick found with that code.";return}focus(b);show(b);return;
  }
  // Anonymous submissions cannot be discovered through public name search.
  const matches=bricks.filter(b=>!b.anon&&b.name&&b.name.toLocaleLowerCase().includes(query.toLocaleLowerCase())).slice(0,50);
  if(!matches.length){$("info").textContent="No named bricks found.";return}
  for(const b of matches){const button=document.createElement("button");button.type="button";button.textContent=b.name;const extra=document.createElement("small");extra.textContent=b.id+" · Layer "+(b.p.layer+1);button.appendChild(extra);button.onclick=()=>{focus(b);show(b)};$("results").appendChild(button)}
  if(matches.length===50){const note=document.createElement("p");note.className="hint";note.textContent="Showing the first 50 matches. Try a more specific name.";$("results").appendChild(note)}
};
$("q").addEventListener("keydown",e=>{if(e.key==="Enter")$("go").click()});
$("appr").onclick=()=>{for(const b of bricks)if(b.mine&&b.status==="pending")approveBrick(b);saveMine();updateCount();openPanel("add");$("msg").textContent="Approved (demo). In the real version this is the admin’s decision."};
function addTestBricks(n){
  const start=bricks.length;
  for(let i=0;i<n;i++){const j=start+i;addBrick({id:newId(),name:"Test visitor "+(j+1),anon:false,aff:j%23===0?"UAL":j%31===0?"Walworth Garden":"None",msg:"Rendering test brick",status:"approved",visualKind:j%23===0?"check":j%31===0?"stripe":"plain"},false)}
  updateCount();const last=bricks[bricks.length-1];camTarget=Math.max(2.2,last.p.y+.6);
  openPanel("add");$("msg").textContent=n.toLocaleString()+" temporary demo bricks added.";
}
$("more500").onclick=()=>addTestBricks(500);
$("more2000").onclick=()=>addTestBricks(2000);
// Fixed rendering settings: softness 0%, brush coverage 100%, dragged strokes 100%.
postMaterial.uniforms.uStrength.value=0;
postMaterial.uniforms.uStreak.value=1;
inkMaterial.uniforms.uInk.value=1;
inkMaterial.uniforms.uDrag.value=1;
grassU.uDrag.value=1;
</script>
