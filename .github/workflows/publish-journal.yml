name: Publish journal

on:
  repository_dispatch:
    types: [publish-journal]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-journal
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build approved journal pages
        run: node scripts/publish-journal.mjs
      - name: Publish pages
        run: |
          git add index.html sitemap.xml journal anis-ghebache/dev-journal anna-verdes/journal
          if git diff --cached --quiet; then
            echo "No approved journal changes."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Publish approved journal entries."
          git push
